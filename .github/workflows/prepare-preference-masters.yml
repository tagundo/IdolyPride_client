name: Prepare verified profile preference masters
on:
  workflow_dispatch:
  push:
    branches: [feat/ios-unified-server]
    paths:
      - .github/workflows/prepare-preference-masters.yml
      - tools/prepare_preference_masters.py
      - tests/test_prepare_preference_masters.py
permissions:
  contents: read
concurrency:
  group: preference-master-data-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Install exact locked dependencies
        run: uv sync --locked --all-extras --python 3.12
      - name: Verify extraction and generated module boundaries
        run: uv run --locked python -m pytest -q tests/test_prepare_preference_masters.py --junitxml="$RUNNER_TEMP/preference-unit.xml"
      - name: Fetch only SHA-pinned public server inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked python tools/release_platform_builds.py
          --platform inputs --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/preference-input-fetch"
          --output "$RUNNER_TEMP/preference-inputs"
      - name: Decode two original public packs and generate data-only source
        run: >-
          uv run --locked python tools/prepare_preference_masters.py
          --server-data "$RUNNER_TEMP/preference-inputs/ServerData.zip"
          --work "$RUNNER_TEMP/preference-decode"
          --output-json "$RUNNER_TEMP/preference-output/preference-masters.json"
          --output-module "$RUNNER_TEMP/preference-output/preference_master_data.py"
          --report "$RUNNER_TEMP/preference-output/preference-master-report.json"
      - name: Bind generated metadata to exact source
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'preference-output'
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['GITHUB_SHA']
          def record(path):
              return {'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          value={'schema':1,'status':'PASS','source_commit':source,
                 'run_id':int(os.environ['GITHUB_RUN_ID']),
                 'source_files':{name:record(pathlib.Path(name)) for name in
                   ['tools/prepare_preference_masters.py','src/idoly_local/master_translation_build.py']},
                 'outputs':{name:record(root/name) for name in
                   ['preference-masters.json','preference_master_data.py','preference-master-report.json']}}
          (root/'source-binding.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: preference-master-data-${{ github.sha }}
          path: |
            ${{ runner.temp }}/preference-output/*
            ${{ runner.temp }}/preference-unit.xml
          if-no-files-found: error
          retention-days: 14
