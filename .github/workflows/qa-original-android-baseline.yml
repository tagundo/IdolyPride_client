name: Observe untouched original Android client on official Google Play image

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Official Google Play system image API
        type: choice
        default: '35'
        options: ['35', '36']
      render_profile:
        description: Stock rendering comparison; compact also lowers Android display size
        type: choice
        default: default
        options: [default, compact_gles]

permissions:
  contents: read

concurrency:
  group: original-android-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # GitHub requires write access to read the user's unpublished original asset.
    # This job downloads it only and never publishes a release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: data/original-android-baseline
      BASELINE_RENDER_PROFILE: ${{ inputs.render_profile || 'default' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Prepare stock SDK and verify the untouched original package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          df -h . > "$RESULTS/disk-before.txt"
          sudo rm -rf /usr/share/dotnet /opt/ghc
          if [[ -c /dev/kvm ]]; then sudo chmod 0666 /dev/kvm; fi
          { lscpu; free -h; test ! -c /dev/kvm || ls -l /dev/kvm; } > "$RESULTS/host.txt"
          # The emulator binary needs PulseAudio even with guest audio disabled.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          sdkmanager 'emulator'
          "$ANDROID_HOME/emulator/emulator" -version > "$RESULTS/emulator-version.txt" 2>&1
          "$ANDROID_HOME/emulator/emulator" -accel-check > "$RESULTS/acceleration.txt" 2>&1 || true
          "$ANDROID_HOME/emulator/emulator" -help-gpu > "$RESULTS/emulator-help-gpu.txt" 2>&1
          "$ANDROID_HOME/emulator/emulator" -help-feature > "$RESULTS/emulator-help-feature.txt" 2>&1
          case "$BASELINE_RENDER_PROFILE" in
            default)
              echo 'BASELINE_EMULATOR_OPTIONS=-no-window -no-audio -no-boot-anim -no-snapshot -gpu software -tcpdump /tmp/idoly-original-baseline.pcap' >> "$GITHUB_ENV"
              ;;
            compact_gles)
              cp "$ANDROID_HOME/emulator/lib/advancedFeatures.ini" "$RESULTS/emulator-advancedFeatures.ini"
              python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          results = Path(os.environ['RESULTS'])
          assert re.search(r'^\s*swiftshader\s+->', (results / 'emulator-help-gpu.txt').read_text(), re.M), 'Stock SwiftShader mode is unavailable'
          assert 'disable an emulator feature by name' in (results / 'emulator-help-feature.txt').read_text(), 'Stock feature override is unavailable'
          assert re.search(r'^Vulkan\s*=', (results / 'emulator-advancedFeatures.ini').read_text(), re.M), 'Stock Vulkan feature is unavailable'
          PY
              echo 'BASELINE_EMULATOR_OPTIONS=-no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan -tcpdump /tmp/idoly-original-baseline.pcap' >> "$GITHUB_ENV"
              ;;
            *) exit 1 ;;
          esac
          gh api repos/tagundo/IdolyPride_client/releases/assets/725772331 \
            -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/original.xapk"
          python3 tools/run_original_android_baseline.py --prepare \
            --xapk "$RUNNER_TEMP/original.xapk" --output "$RESULTS"
      - name: Install original signed base and split, then observe without account input
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '35' }}
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          disk-size: 4G
          disable-linux-hw-accel: auto
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: ${{ env.BASELINE_EMULATOR_OPTIONS }}
          script: python3 tools/run_original_android_baseline.py --output "$RESULTS" --observe-seconds 180 --api-level "${{ inputs.api_level || '35' }}" --render-profile "$BASELINE_RENDER_PROFILE" --pcap /tmp/idoly-original-baseline.pcap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-android-baseline-${{ github.run_id }}
          path: data/original-android-baseline/
          if-no-files-found: error
          retention-days: 14
