name: Verify multilingual Android client tooling

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-unified-server]
    paths: [.github/workflows/verify-android-client-tools.yml]

permissions:
  contents: read

concurrency:
  group: verify-android-client-tools
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  android-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install locked client tools and pinned Android SDK
        run: |
          uv sync --locked --all-extras --python 3.13
          uv pip install --python .venv/bin/python 'UnityPy==1.25.4'
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
      - name: Verify hosted resource guards and unchanged builder defaults
        run: >-
          uv run --locked pytest tests/test_release_android_clients.py
          client-presentation/tests/test_builder.py client-presentation/tests/test_full_client.py -q
      - name: Build and verify Japanese and English game clients
        run: >-
          uv run --locked python -B tools/release_android_clients.py
          --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/idoly-android-client-work"
          --output "$RUNNER_TEMP/idoly-android-clients"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: client-tools-check-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-android-clients
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: client-tools-check-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idoly-android-clients/*.json
            ${{ runner.temp }}/idoly-android-clients/native/*.json
          if-no-files-found: warn
          retention-days: 14
