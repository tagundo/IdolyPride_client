name: Finalize verified native server draft

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IDOLY_SERVER_TAG: local-server-v0.2.0
      IDOLY_PAYLOAD_NAME: IdolyPride-ServerData-v0.2.0.zip
      IDOLY_RELEASE_ID: "438998921"
      IDOLY_SOURCE_RUN: "42605977466"
      IDOLY_SOURCE_SHA: ef8239745bc521b1e6a469be11c37fe87426957d
      IDOLY_PAYLOAD_SHA: 6237eba7567639a304543b3858a0c60759d616d47389279a06abe937a75a2b4c
      IDOLY_APK_SHA: 1f0f9946d34d5fedd0a80bd31d53772d3faa921531b6cf0389be64830901c359
      IDOLY_APP_SHA: 46c1ef718141783b261f7476f19246c727520f3422bccfc4044955acb2e64adc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the workflow reader
        run: python -m pip install PyYAML==6.0.3
      - name: Require successful native QA and finalize the existing draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$IDOLY_SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GH_REPO/actions/runs/$IDOLY_SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import yaml

          temporary = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((temporary / 'source-run.json').read_text())
          jobs = json.loads((temporary / 'source-jobs.json').read_text())['jobs']
          assert run['head_sha'] == os.environ['IDOLY_SOURCE_SHA']
          results = {job['name']: job['conclusion'] for job in jobs}
          assert all(results.get(name) == 'success' for name in ('prepare', 'android', 'macos'))
          workflow = yaml.safe_load(Path('.github/workflows/build-server-apps.yml').read_text())
          script = workflow['jobs']['verify']['steps'][0]['run']
          environment = dict(os.environ, GITHUB_SHA=os.environ['IDOLY_SOURCE_SHA'])
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', script], env=environment, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-server-release-verification
          path: data/release-verification
          if-no-files-found: error
