name: Verify Android account import native candidate

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-unified-server]
    paths:
      - .github/workflows/verify-android-account-import.yml
      - android-server/app/src/main/java/game/qualiarts/idolypride/localserver/MainActivity.java

permissions:
  contents: read

concurrency:
  group: verify-android-account-import-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  IDOLY_RELEASE_BUILD: '53'

# Exact Android build/emulator gates from release-all-platforms, artifact only.
# Existing draft input downloads need write-scoped contents permission.
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GRADLE_OPTS: '-Dorg.gradle.workers.max=1 -Dorg.gradle.jvmargs=-Xmx1536m'
    steps:
      - name: Label internal artifacts with the current Seoul date
        run: echo "IDOLY_RELEASE_VERSION=$(TZ=Asia/Seoul date +%Y.%m.%d).1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install locked dependencies and pinned Android toolchain
        run: |
          uv sync --locked --all-extras --python 3.13
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
      - name: Build signed ARM64 server and separate x86_64 QA server
        run: >-
          uv run --locked python tools/release_platform_builds.py
          --platform android --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/idoly-android-work"
          --output "$RUNNER_TEMP/idoly-android-build"
      - name: Enable acceleration for the disposable CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-idoly-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual x86_64 server UI and encrypted RPCs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          disk-size: 4G
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            uv run --locked python tools/release_platform_builds.py
            --platform android-qa --source-commit "$GITHUB_SHA"
            --inputs "$RUNNER_TEMP/idoly-android-build"
            --work "$RUNNER_TEMP/idoly-android-qa"
            --output "$RUNNER_TEMP/idoly-android-final"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-android-account-import-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-android-final
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain small Android launcher visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-android-account-import-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idoly-android-qa/qa/02-running.png
            ${{ runner.temp }}/idoly-android-qa/qa/02-running.xml
            ${{ runner.temp }}/idoly-android-qa/qa/04-stopped.png
            ${{ runner.temp }}/idoly-android-qa/qa/04-stopped.xml
            ${{ runner.temp }}/idoly-android-qa/qa/75-account-provider-before.png
            ${{ runner.temp }}/idoly-android-qa/qa/75-account-provider-after.png
            ${{ runner.temp }}/idoly-android-qa/qa/76-account-preview-timeout.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verified-android-account-import-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idoly-android-work/**/*.json
            ${{ runner.temp }}/idoly-android-work/gradle-*.log
            ${{ runner.temp }}/idoly-android-build/build-failure.json
            ${{ runner.temp }}/idoly-android-final/build-failure.json
            ${{ runner.temp }}/idoly-android-qa/emulator-QA.log
            ${{ runner.temp }}/idoly-android-qa/qa/*.json
            ${{ runner.temp }}/idoly-android-qa/qa/*.xml
            ${{ runner.temp }}/idoly-android-qa/qa/*logcat.txt
          if-no-files-found: warn
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install locked Mac build dependencies
        run: |
          test "$(uname -m)" = arm64
          uv sync --locked --python 3.12
          uv pip install --python .venv/bin/python -r macos-server/requirements-build.txt
          gh api repos/tagundo/IdolyPride_client/releases/assets/732944285 --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/idoly-mac-protocol.zip"
          uv run --locked python macos-preserver/extract_descriptor.py --payload "$RUNNER_TEMP/idoly-mac-protocol.zip" --output data/protocol/idolypride-6.1.1.pb
          rm "$RUNNER_TEMP/idoly-mac-protocol.zip"
          uv run --locked python -m pytest -q macos-server/tests
      - name: Build and exercise relocated native SwiftUI server
        run: >-
          uv run --locked python tools/release_platform_builds.py
          --platform macos --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/idoly-macos-work"
          --output "$RUNNER_TEMP/idoly-macos-final"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: optimized-release-macos-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-macos-final
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: optimized-release-macos-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-macos-work/**/*.json
          if-no-files-found: warn
          retention-days: 14

  ios-unified:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch SHA-pinned runtime, game and public server inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ios-unified/fetch_inputs.py --output "$RUNNER_TEMP/idoly-unified-inputs"
      - name: Install build verification dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest==8.4.2 pycryptodome==3.23.0
          python3 -m pip install --no-index "$RUNNER_TEMP"/idoly-unified-inputs/wheels/*.whl
      - name: Verify host lifecycle, packaging, load gate and settings bridge
        run: |
          python3 -B -m pytest -q -p no:cacheprovider tests/test_ios_host.py tests/test_public_payload.py tests/test_ios_unified_*.py ios-unified/native/tests/test_build_native.py
          python3 -B ios-unified/native/build_native.py --portable-tests
      - name: Compile real Apple frameworks and run all five cold language launches
        run: >-
          python3 -B ios-unified/ci_build.py
          --inputs "$RUNNER_TEMP/idoly-unified-inputs"
          --work "$RUNNER_TEMP/idoly-unified-build"
          --output "$RUNNER_TEMP/idoly-unified-output"
          --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-unified-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-unified-output/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-unified-prototype-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-unified-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
