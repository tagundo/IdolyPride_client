name: Stage reviewed v0.3.0 assets into the existing draft only

on:
  workflow_dispatch:
    inputs:
      review_bundle_b64:
        description: Base64 of the exact independently reviewed public QA/manifest/checksums/body envelope
        type: string
        required: true
      review_bundle_sha256:
        description: SHA-256 of that exact approved envelope
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: stage-reviewed-server-v0.3.0-draft-only
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IDOLY_REVIEW_BUNDLE_B64: ${{ inputs.review_bundle_b64 }}
      IDOLY_REVIEW_BUNDLE_SHA256: ${{ inputs.review_bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pinned successful ARM64 APK candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: android-server-build-and-available-evidence-v0.3.0
          repository: tagundo/IdolyPride_client
          run-id: 42889776755
          github-token: ${{ github.token }}
          path: data/android
      - name: Download the pinned successful Apple Silicon candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-server-candidate-and-native-evidence-v0.3.0
          repository: tagundo/IdolyPride_client
          run-id: 42889776755
          github-token: ${{ github.token }}
          path: data/macos
      - name: Verify all reviewed bytes and stage the dedicated draft without publishing
        run: python tools/stage_reviewed_server_draft.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-server-v0.3.0-draft-staging-evidence
          path: data/draft-staging-evidence
          if-no-files-found: warn
