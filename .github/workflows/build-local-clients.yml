name: Build local clients into draft release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-client-draft-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IDOLY_DRAFT_ID: "438945085"
      IDOLY_DRAFT_TAG: local-client-v0.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked development tools
        run: uv sync --locked --all-extras --python 3.12
      - name: Require the existing release to remain a draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/$IDOLY_DRAFT_ID" --jq '.draft and .tag_name == "local-client-v0.1.0"')" = true
      - name: Prepare Android build tools
        shell: bash
        run: |
          set -euo pipefail
          IDOLY_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          IDOLY_BUILD_TOOLS="$IDOLY_SDK_ROOT/build-tools/34.0.0"
          if [[ ! -x "$IDOLY_BUILD_TOOLS/apksigner" ]]; then
            sdkmanager --sdk_root="$IDOLY_SDK_ROOT" "build-tools;34.0.0"
          fi
          test -x "$IDOLY_BUILD_TOOLS/apksigner"
          test -x "$IDOLY_BUILD_TOOLS/zipalign"
          test -x "$IDOLY_BUILD_TOOLS/aapt2"
          echo "IDOLY_BUILD_TOOLS=$IDOLY_BUILD_TOOLS" >> "$GITHUB_ENV"
      - name: Download and verify the original client assets and APKEditor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/ci-input data/clients
          gh api "repos/$GH_REPO/releases/assets/725772331" --header 'Accept: application/octet-stream' > data/ci-input/idolypride-6.1.1.xapk
          gh api "repos/$GH_REPO/releases/assets/725761399" --header 'Accept: application/octet-stream' > data/ci-input/idolypride-6.1.1-decrypted.ipa
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar \
            --output data/ci-input/APKEditor-1.4.1.jar
          uv run --locked python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "idolypride-6.1.1.xapk": "ab3bd9186ccc2659f91fcf2a48e25b591e94b4209c505f2ca401be8b22e5de36",
              "idolypride-6.1.1-decrypted.ipa": "33197938a0990b267af2d67c09e9d1123694e28695fc39d9650ca4f6aa661848",
              "APKEditor-1.4.1.jar": "4a98ae6a755264357603f1906b92e62e757d59229014e33395f4e03ff019fda8",
          }
          for filename, digest in expected.items():
              path = Path("data/ci-input") / filename
              with path.open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if actual != digest:
                  raise SystemExit("Input digest mismatch: " + filename)
              print("Verified " + filename)
          PY
      - name: Recover the exact client schema
        run: >-
          uv run --locked --all-extras python tools/extract_client_schema.py
          data/ci-input/idolypride-6.1.1.xapk
          --output data/protocol/idolypride-6.1.1.pb
      - name: Run tests and the local transport smoke check
        run: |
          uv run --locked --all-extras pytest -q
          uv run --locked python -m compileall -q src tools
          uv run --locked idoly-local smoke
      - name: Build the signed standalone Android client
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python tools/package_android_client.py \
            data/ci-input/idolypride-6.1.1.xapk \
            --output data/clients/IdolyPride-6.1.1-Local-Android.apk \
            --apkeditor data/ci-input/APKEditor-1.4.1.jar \
            --build-tools "$IDOLY_BUILD_TOOLS" \
            --signing-dir "$RUNNER_TEMP/idoly-client-signing"
      - name: Build the PlayCover client
        run: >-
          uv run --locked python tools/patch_ios_client.py
          data/ci-input/idolypride-6.1.1-decrypted.ipa
          --output data/clients/IdolyPride-6.1.1-Local-PlayCover.ipa
      - name: Archive the public original master packs
        run: >-
          uv run --locked idoly-local archive-master
          --output data/original-master --workers 6
      - name: Package server data and calculate output checksums
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          clients = Path("data/clients")
          archive = Path("data/original-master")
          report = json.loads((archive / "archive-report.json").read_text())
          if not report.get("complete") or not report.get("packs"):
              raise SystemExit("The public master archive is incomplete")
          files = [Path("data/protocol/idolypride-6.1.1.pb"),
                   Path("data/protocol/idolypride-6.1.1.evidence.json"),
                   archive / "response.pb", archive / "master-tag.json",
                   archive / "archive-report.json"]
          for pack in report["packs"].values():
              path = archive / "assets/master" / pack["file_name"]
              if not path.resolve().is_relative_to((archive / "assets/master").resolve()):
                  raise SystemExit("Master pack path escaped the archive")
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              if path.stat().st_size != pack["size"] or digest != pack["sha256"]:
                  raise SystemExit("Master pack digest mismatch")
              files.append(path)
          server_data = clients / "IdolyPride-6.1.1-Local-ServerData.zip"
          with ZipFile(server_data, "x", compression=ZIP_DEFLATED, compresslevel=6) as zipped:
              for path in sorted(files):
                  zipped.write(path, arcname=path.as_posix())
          with ZipFile(server_data) as zipped:
              if zipped.testzip() is not None:
                  raise SystemExit("ServerData ZIP failed its CRC check")
          outputs = [clients / "IdolyPride-6.1.1-Local-Android.apk",
                     clients / "IdolyPride-6.1.1-Local-Android.apk.evidence.json",
                     clients / "IdolyPride-6.1.1-Local-PlayCover.ipa",
                     clients / "IdolyPride-6.1.1-Local-PlayCover.report.json", server_data]
          sums = []
          for path in outputs:
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              sums.append(digest + "  " + path.name + "\n")
          (clients / "SHA256SUMS").write_text("".join(sums), encoding="ascii")
          print("Verified public server data and five output checksums")
          PY
      - name: Upload verified files to the existing draft only
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases/$IDOLY_DRAFT_ID" --jq '.draft and .tag_name == "local-client-v0.1.0"')" = true
          gh release upload "$IDOLY_DRAFT_TAG" --repo "$GH_REPO" --clobber \
            data/clients/IdolyPride-6.1.1-Local-Android.apk \
            data/clients/IdolyPride-6.1.1-Local-Android.apk.evidence.json \
            data/clients/IdolyPride-6.1.1-Local-PlayCover.ipa \
            data/clients/IdolyPride-6.1.1-Local-PlayCover.report.json \
            data/clients/IdolyPride-6.1.1-Local-ServerData.zip \
            data/clients/SHA256SUMS
          test "$(gh api "repos/$GH_REPO/releases/$IDOLY_DRAFT_ID" --jq '.draft and .tag_name == "local-client-v0.1.0"')" = true
      - name: Verify GitHub received the actual output bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$IDOLY_DRAFT_ID" > "$RUNNER_TEMP/idoly-uploaded-draft.json"
          uv run --locked python - "$RUNNER_TEMP/idoly-uploaded-draft.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text())
          if release.get("draft") is not True or release.get("tag_name") != "local-client-v0.1.0":
              raise SystemExit("The target release must remain the existing draft")
          assets = {asset["name"]: asset for asset in release["assets"]}
          clients = Path("data/clients")
          names = [line.split("  ", 1)[1] for line in (clients / "SHA256SUMS").read_text().splitlines()]
          for name in [*names, "SHA256SUMS"]:
              path = clients / name
              with path.open("rb") as stream:
                  digest = "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()
              asset = assets.get(name, {})
              if asset.get("size") != path.stat().st_size or asset.get("digest") != digest:
                  raise SystemExit("Uploaded asset size/digest mismatch: " + name)
              print("GitHub verified " + name)
          PY
      - name: Record draft build scope
        shell: bash
        run: |
          {
            echo 'Verified APK, PlayCover IPA, public server data, reports and SHA256SUMS were uploaded to the existing draft.'
            echo 'This first draft uses an ephemeral Android development signing key, destroyed after the job.'
            echo 'Configure a stable signing key before routine Android update releases; a different key cannot update an installed APK.'
            echo 'PlayCover must re-sign the IPA. No Android or PlayCover device execution was performed by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the ephemeral CI signing key
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/idoly-client-signing"
