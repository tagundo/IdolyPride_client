name: Verify and release server and clients

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release date in Asia/Seoul, YYYY.MM.DD.N (for example 2026.11.16.1)
        type: string
        required: true
      publish:
        description: Publish a new date-versioned prerelease only after all platform and performance gates pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: optimized-release
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  IDOLY_RELEASE_VERSION: '${{ inputs.release_version }}'
  IDOLY_RELEASE_BUILD: '53'
  IDOLY_OPTIMIZATION_BASELINE: '50e349f4db6db0d3122bdc09c3b06307145f814f'

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned Java harness Android tools
        run: sdkmanager 'build-tools;34.0.0' 'platforms;android-34'
      - name: Install exact locked verification dependencies
        run: uv sync --locked --all-extras --python 3.12
      - name: Prepare the SHA-pinned public protocol descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          PROTOCOL_PAYLOAD: ${{ runner.temp }}/idoly-public-protocol-payload.zip
        run: |
          gh api repos/tagundo/IdolyPride_client/releases/assets/732944285 --header 'Accept: application/octet-stream' > "$PROTOCOL_PAYLOAD"
          uv run --locked python macos-preserver/extract_descriptor.py --payload "$PROTOCOL_PAYLOAD" --output data/protocol/idolypride-6.1.1.pb
          rm "$PROTOCOL_PAYLOAD"
      - name: Fetch SHA-pinned public masters for mandatory preference contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked --all-extras python tools/release_platform_builds.py
          --platform inputs --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/idoly-recovery-input-fetch"
          --output "$RUNNER_TEMP/idoly-recovery-inputs"
      - name: Extract owned real-master references outside the checkout
        run: |
          uv run --locked --all-extras python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          from tools.release_platform_builds import Guard, extract_qa_references
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          inputs = temporary/'idoly-recovery-inputs'
          references = temporary/'idoly-recovery-references'
          proof = json.loads((inputs/'inputs-report.json').read_text())
          expected = {'bytes':191343014,'sha256':'37dbf0fb9bac5d860991753d2e41ff0c269684bfca673ba41e1bcb897651c223'}
          assert proof['status'] == 'PASS' and proof['source_commit'] == os.environ['GITHUB_SHA']
          assert proof['inputs']['server_data'] == expected
          extract_qa_references(inputs/'ServerData.zip', references, Guard(), expected_pin=expected)
          descriptor = references/'protocol/idolypride-6.1.1.pb'
          descriptor_sha = hashlib.sha256(descriptor.read_bytes()).hexdigest()
          assert descriptor_sha == 'c82cee62abdca7144d11e710a6f773211464a89d2ddede207999a0a5e7aec8ad'
          assert hashlib.sha256(pathlib.Path('data/protocol/idolypride-6.1.1.pb').read_bytes()).hexdigest() == descriptor_sha
          version = (references/'master-json/!version.txt').read_text().strip()
          assert version == '961e456499039e31248a818a911c8d95f92461f86aff4674ba07e29c32afcf60'
          artifact = temporary/'idoly-portable'
          artifact.mkdir()
          shutil.copyfile(inputs/'inputs-report.json', artifact/'preference-inputs-report.json')
          (artifact/'preference-references.json').write_text(json.dumps({'schema':1,'status':'PASS',
              'server_data':expected,'schema_sha256':descriptor_sha,'master_version':version,
              'master_json_files':len(list((references/'master-json').glob('*.json'))),
              'copied_to_source_checkout':False})+'\n')
          PY
      - name: Require actual supplementary-master and media-inventory contracts
        shell: bash
        env:
          IDOLY_PREFERENCE_MASTER_DIR: ${{ runner.temp }}/idoly-recovery-references/master-json
        run: |
          set -euo pipefail
          uv run --locked --all-extras python -m pytest -q \
            tests/test_profile_preferences.py::test_generated_preference_supplement_matches_recorded_original_tables \
            tests/test_profile_preferences.py::test_actual_pinned_supplement_fallback_updates_owned_card_and_decoration \
            tests/test_media_profile.py::test_actual_pinned_media_inventory_includes_all_verified_decorations \
            --junitxml="$RUNNER_TEMP/idoly-portable/preference-contracts.xml" \
            | tee "$RUNNER_TEMP/idoly-portable/preference-contracts.txt"
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          root = ET.parse(pathlib.Path(os.environ['RUNNER_TEMP'])/'idoly-portable/preference-contracts.xml').getroot()
          cases = list(root.iter('testcase'))
          required = {'test_generated_preference_supplement_matches_recorded_original_tables',
                      'test_actual_pinned_supplement_fallback_updates_owned_card_and_decoration',
                      'test_actual_pinned_media_inventory_includes_all_verified_decorations'}
          assert len(cases) >= 3 and required <= {case.attrib['name'].split('[',1)[0] for case in cases}
          assert not any(list(root.iter(tag)) for tag in ('failure','error','skipped'))
          assert all(int(suite.get(key,'0')) == 0 for suite in root.iter('testsuite')
                     for key in ('failures','errors','skipped'))
          PY
      - name: Prepare Swift system modules before bounded formatter checks
        shell: bash
        timeout-minutes: 3
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            printf 'import Foundation\nimport CoreFoundation\n' | swiftc -typecheck -
          fi
      - name: Run shared server and portable platform regressions
        shell: bash
        env:
          IDOLY_PREFERENCE_MASTER_DIR: ${{ runner.temp }}/idoly-recovery-references/master-json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/idoly-portable"
          uv run --locked --all-extras python -m pytest -q \
            --junitxml="$RUNNER_TEMP/idoly-portable/tests.xml" \
            | tee "$RUNNER_TEMP/idoly-portable/tests.txt"
          uv run --locked python -m compileall -q src tools android-server/app/src/main/python macos-server
          uv run --locked python ios-unified/native/build_native.py --portable-tests \
            | tee "$RUNNER_TEMP/idoly-portable/native-policy.txt"
      - name: Bind verification to this exact source
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          artifact = pathlib.Path(os.environ['RUNNER_TEMP'])/'idoly-portable'
          junit = artifact/'preference-contracts.xml'
          root = ET.parse(junit).getroot()
          cases = list(root.iter('testcase'))
          required = {'test_generated_preference_supplement_matches_recorded_original_tables',
                      'test_actual_pinned_supplement_fallback_updates_owned_card_and_decoration',
                      'test_actual_pinned_media_inventory_includes_all_verified_decorations'}
          assert len(cases) >= 3 and required <= {case.attrib['name'].split('[',1)[0] for case in cases}
          assert not any(list(root.iter(tag)) for tag in ('failure','error','skipped'))
          assert all(int(suite.get(key,'0')) == 0 for suite in root.iter('testsuite')
                     for key in ('failures','errors','skipped'))
          expected = {'bytes':191343014,'sha256':'37dbf0fb9bac5d860991753d2e41ff0c269684bfca673ba41e1bcb897651c223'}
          inputs = json.loads((artifact/'preference-inputs-report.json').read_text())
          assert inputs['status'] == 'PASS' and inputs['source_commit'] == source
          assert inputs['inputs']['server_data'] == expected
          proof_path = pathlib.Path('docs/preference-master-data.json')
          proof = json.loads(proof_path.read_text())
          assert proof['status'] == 'PASS' and proof['input_unchanged'] is True
          assert proof['source'] == expected
          master_version = '961e456499039e31248a818a911c8d95f92461f86aff4674ba07e29c32afcf60'
          assert proof['master_version'] == master_version
          counts = {key:proof['packs'][key]['rows'] for key in ('CardImage','Decoration')}
          assert counts == {'CardImage':611,'Decoration':361}
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          module_sha = digest(pathlib.Path('src/idoly_local/preference_master_data.py'))
          assert module_sha == proof['output']['module']['sha256']
          contracts = {'input':expected,'master_version':master_version,'selected_counts':counts,
              'junit':{'name':junit.name,'bytes':junit.stat().st_size,'sha256':digest(junit)},
              'tests':{'count':len(cases),'failures':0,'errors':0,'skipped':0},
              'module_sha256':module_sha,'supplement_report_sha256':digest(proof_path)}
          (artifact/'portable-report.json').write_text(json.dumps({'schema':1,'status':'PASS',
              'source_commit':source,'validation':{'pytest_passed':True,'compileall_passed':True,
                  'actual_preference_master_contracts_passed':True},'preference_master_contracts':contracts})+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: optimized-release-portable-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-portable
          if-no-files-found: error
          retention-days: 14

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: uv sync --locked --all-extras --python 3.13
      - name: Fetch only verified public resource inputs
        run: >-
          uv run --locked python tools/release_platform_builds.py
          --platform inputs --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/idoly-perf-input-work"
          --output "$RUNNER_TEMP/idoly-perf-inputs"
      - name: Compare exact baseline and candidate in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/idoly-baseline" "$RUNNER_TEMP/idoly-performance"
          git archive "$IDOLY_OPTIMIZATION_BASELINE" src | tar -x -C "$RUNNER_TEMP/idoly-baseline"
          uv run --locked python tools/benchmark_diagnostics_polling.py \
            --baseline-root "$RUNNER_TEMP/idoly-baseline" --candidate-root "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/idoly-diagnostics-bench" \
            --output "$RUNNER_TEMP/idoly-diagnostics-bench/report.json" \
            --iterations 1000 --repeats 3 --tracemalloc
          uv run --locked python tools/benchmark_translation_startup.py \
            --baseline-root "$RUNNER_TEMP/idoly-baseline" --candidate-root "$GITHUB_WORKSPACE" \
            --server-data "$RUNNER_TEMP/idoly-perf-inputs/ServerData.zip" \
            --translations "$RUNNER_TEMP/idoly-perf-inputs/bundledTranslations.zip" \
            --work "$RUNNER_TEMP/idoly-translation-bench" \
            --output "$RUNNER_TEMP/idoly-translation-bench/report.json" --runs 3
          cp "$RUNNER_TEMP/idoly-diagnostics-bench/report.json" "$RUNNER_TEMP/idoly-performance/diagnostics-polling.json"
          cp "$RUNNER_TEMP/idoly-translation-bench/report.json" "$RUNNER_TEMP/idoly-performance/translation-startup.json"
          cp "$RUNNER_TEMP/idoly-perf-inputs/inputs-report.json" "$RUNNER_TEMP/idoly-performance/inputs-report.json"
      - name: Bind benchmark evidence to source and baseline
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'idoly-performance'
          def record(name):
              path=root/name
              return {'name':name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          value={'schema':1,'status':'PASS','source_commit':os.environ['GITHUB_SHA'],
                 'baseline_commit':os.environ['IDOLY_OPTIMIZATION_BASELINE'],
                 'benchmarks':{'diagnostics':record('diagnostics-polling.json'),'translation':record('translation-startup.json')}}
          (root/'performance-report.json').write_text(json.dumps(value)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: optimized-release-performance-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-performance
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: optimized-release-performance-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idoly-diagnostics-bench/*.json
            ${{ runner.temp }}/idoly-translation-bench/*.json
          if-no-files-found: warn
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GRADLE_OPTS: '-Dorg.gradle.workers.max=1 -Dorg.gradle.jvmargs=-Xmx1536m'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install locked dependencies and pinned Android toolchain
        run: |
          uv sync --locked --all-extras --python 3.13
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
      - name: Build signed ARM64 server and separate x86_64 QA server
        run: >-
          uv run --locked python tools/release_platform_builds.py
          --platform android --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/idoly-android-work"
          --output "$RUNNER_TEMP/idoly-android-build"
      - name: Enable acceleration for the disposable CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-idoly-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual x86_64 server UI and encrypted RPCs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          disk-size: 4G
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            uv run --locked python tools/release_platform_builds.py
            --platform android-qa --source-commit "$GITHUB_SHA"
            --inputs "$RUNNER_TEMP/idoly-android-build"
            --work "$RUNNER_TEMP/idoly-android-qa"
            --output "$RUNNER_TEMP/idoly-android-final"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: optimized-release-android-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-android-final
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain small Android launcher visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-release-android-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idoly-android-qa/qa/02-running.png
            ${{ runner.temp }}/idoly-android-qa/qa/02-running.xml
            ${{ runner.temp }}/idoly-android-qa/qa/04-stopped.png
            ${{ runner.temp }}/idoly-android-qa/qa/04-stopped.xml
            ${{ runner.temp }}/idoly-android-qa/qa/75-account-provider-before.png
            ${{ runner.temp }}/idoly-android-qa/qa/75-account-provider-after.png
            ${{ runner.temp }}/idoly-android-qa/qa/76-account-preview-timeout.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: optimized-release-android-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idoly-android-work/**/*.json
            ${{ runner.temp }}/idoly-android-work/gradle-*.log
            ${{ runner.temp }}/idoly-android-build/build-failure.json
            ${{ runner.temp }}/idoly-android-final/build-failure.json
            ${{ runner.temp }}/idoly-android-qa/emulator-QA.log
            ${{ runner.temp }}/idoly-android-qa/qa/*.json
            ${{ runner.temp }}/idoly-android-qa/qa/*.xml
            ${{ runner.temp }}/idoly-android-qa/qa/*logcat.txt
          if-no-files-found: warn
          retention-days: 14

  ios-unified:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch SHA-pinned runtime, game and public server inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ios-unified/fetch_inputs.py --output "$RUNNER_TEMP/idoly-unified-inputs"
      - name: Install build verification dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest==8.4.2 pycryptodome==3.23.0
          python3 -m pip install --no-index "$RUNNER_TEMP"/idoly-unified-inputs/wheels/*.whl
      - name: Verify host lifecycle, packaging, load gate and settings bridge
        run: |
          python3 -B -m pytest -q -p no:cacheprovider tests/test_ios_host.py tests/test_public_payload.py tests/test_ios_unified_*.py ios-unified/native/tests/test_build_native.py
          python3 -B ios-unified/native/build_native.py --portable-tests
      - name: Compile real Apple frameworks and run all five cold language launches
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B ios-unified/ci_build.py
          --inputs "$RUNNER_TEMP/idoly-unified-inputs"
          --work "$RUNNER_TEMP/idoly-unified-build"
          --output "$RUNNER_TEMP/idoly-unified-output"
          --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-unified-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-unified-output/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-unified-prototype-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-unified-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install locked client tools and pinned Android SDK
        run: |
          uv sync --locked --all-extras --python 3.13
          uv pip install --python .venv/bin/python 'UnityPy==1.25.4'
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
      - name: Build and verify Japanese and English game clients
        run: >-
          uv run --locked python -B tools/release_android_clients.py
          --source-commit "$GITHUB_SHA"
          --work "$RUNNER_TEMP/idoly-android-client-work"
          --output "$RUNNER_TEMP/idoly-android-clients"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: optimized-release-android-clients-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-android-clients
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: optimized-release-android-clients-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/idoly-android-clients/*.json
            ${{ runner.temp }}/idoly-android-clients/native/*.json
          if-no-files-found: warn
          retention-days: 14


  private-artifacts:
    needs: [portable, performance, android, android-clients, ios-unified]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && !inputs.publish
          && needs.portable.result == 'success'
          && needs.performance.result == 'success'
          && needs.android.result == 'success'
          && needs.ios-unified.result == 'success'
          && needs.android-clients.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Install locked verification dependencies
        run: uv sync --locked --all-extras --python 3.13
      - name: Verify and copy changed executables to dated private filenames
        run: >-
          uv run --locked python -B tools/stage_private_candidate.py
          --candidate-version "$IDOLY_RELEASE_VERSION"
          --source-commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --work "$RUNNER_TEMP/idoly-private-candidate-work"
          --output "$RUNNER_TEMP/idoly-private-candidate"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: private-candidate-android-${{ inputs.release_version }}-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-private-candidate/android
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: private-candidate-ios-unified-${{ inputs.release_version }}-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-private-candidate/ios-unified
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [portable, performance, android, android-clients, ios-unified]
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.publish)
          && needs.portable.result == 'success'
          && needs.performance.result == 'success'
          && needs.android.result == 'success'
          && needs.ios-unified.result == 'success'
          && needs.android-clients.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Install locked artifact verification dependencies
        run: uv sync --locked --all-extras --python 3.13
      - name: Verify all platform artifacts and publish only the fresh release
        run: >-
          uv run --locked python -B tools/publish_optimized_release.py
          --release-version "$IDOLY_RELEASE_VERSION"
          --source-commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --work "$RUNNER_TEMP/idoly-optimized-publication"
          --output "$RUNNER_TEMP/idoly-optimized-publication-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-release-publication-proof-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-optimized-publication-proof
          if-no-files-found: warn
          retention-days: 14
