              --output data/dist/IdolyPride-Diagnostics-Probe.apk \
              --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
              --android-jar "$ANDROID_HOME/platforms/android-34/android.jar"
          fi
          # No compiler is used after this step. Recover space for the API35
          # image/userdata while retaining exact libraries and build reports.
          chmod -R u+w data/native-live-cache
          rm -rf data/native-live-cache "$ANDROID_HOME/ndk/26.3.11579264" android-server/app/build
