  ios-unified:
    if: ${{ inputs.ios_unified }}
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch exact public runtime, game and server-data inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ios-unified/fetch_inputs.py --output "$RUNNER_TEMP/idoly-unified-inputs"
      - name: Install build verification dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pytest==8.4.2 pycryptodome==3.23.0
          python3 -m pip install --no-index "$RUNNER_TEMP"/idoly-unified-inputs/wheels/*.whl
      - name: Verify host lifecycle, packaging, load gate and settings bridge
        run: |
          python3 -B -m pytest -q -p no:cacheprovider tests/test_ios_host.py tests/test_public_payload.py tests/test_ios_unified_*.py ios-unified/native/tests/test_build_native.py
          python3 -B ios-unified/native/build_native.py --portable-tests
      - name: Compile real iOS frameworks, compose IPA and run fresh Simulator core probe
        run: >-
          python3 -B ios-unified/ci_build.py
          --inputs "$RUNNER_TEMP/idoly-unified-inputs"
          --work "$RUNNER_TEMP/idoly-unified-build"
          --output "$RUNNER_TEMP/idoly-unified-output"
          --source-commit "$GITHUB_SHA"
      - name: Keep diagnostics when the build or probe fails
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ios-unified-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-unified-output/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the IPA after the Simulator core probe passes
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: ios-unified-prototype-${{ github.sha }}
          path: ${{ runner.temp }}/idoly-unified-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
