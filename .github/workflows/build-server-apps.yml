              'apk': {'file': apk.name, 'bytes': apk.stat().st_size, 'sha256': digest(apk)},
              'payload': {'file': payload.name, 'bytes': payload.stat().st_size, 'sha256': payload_sha},
              'signature_verification': 'apksigner verify passed',
              'native_runtime_tested': False, 'game_client_gameplay_tested': False,
              'android_apk_uploaded_to_release': False}
          Path('data/android-server-qa/candidate-provenance.json').write_text(json.dumps(report, indent=2) + '\n')
