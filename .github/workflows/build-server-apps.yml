    needs: [prepare, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IDOLY_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      IDOLY_PAYLOAD_SHA: ${{ needs.prepare.outputs.payload_sha256 }}
      IDOLY_APK_SHA: ${{ needs.android.outputs.apk_sha256 }}
      IDOLY_APP_SHA: ${{ needs.macos.outputs.app_sha256 }}
    steps:
      - name: Require all three primary draft assets and verified GitHub digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/release-verification
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" > "$RUNNER_TEMP/idoly-server-final-draft.json"
          python3 - "$RUNNER_TEMP/idoly-server-final-draft.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          release = json.loads(Path(sys.argv[1]).read_text())
          assert release['draft'] is True and release['tag_name'] == os.environ['IDOLY_SERVER_TAG']
          assets = {asset['name']: asset for asset in release['assets']}
          expected = {
              os.environ['IDOLY_PAYLOAD_NAME']: os.environ['IDOLY_PAYLOAD_SHA'],
              'IdolyPride-Local-Server-Android.apk': os.environ['IDOLY_APK_SHA'],
              'IdolyPride-Local-Server-macOS-arm64.app.zip': os.environ['IDOLY_APP_SHA'],
          }
          names = [*expected, 'IdolyPride-Local-Server-Android-QA.zip', 'IdolyPride-Local-Server-macOS-QA.zip',
                   'IdolyPride-Local-Server-Diagnostics-QA.zip']
          records, sums = [], []
          for name in sorted(names):
              asset = assets.get(name, {})
              digest = asset.get('digest', '')
              if asset.get('size', 0) <= 0 or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit('Missing or invalid uploaded asset size/digest: ' + name)
              if name in expected and digest != 'sha256:' + expected[name]:
                  raise SystemExit('Uploaded bytes differ from the successful build: ' + name)
              records.append({'name': name, 'bytes': asset['size'], 'digest': digest})
              sums.append(digest.removeprefix('sha256:') + '  ' + name + '\n')
          root = Path('data/release-verification')
          (root / 'SHA256SUMS').write_text(''.join(sums), encoding='ascii')
          (root / 'RELEASE-VERIFICATION.json').write_text(json.dumps({
              'draft': True, 'release_id': release['id'], 'tag': release['tag_name'],
              'source_commit': os.environ['GITHUB_SHA'], 'assets': records,
              'android_server_emulator_qa_passed': True, 'macos_frozen_engine_and_native_gui_passed': True,
              'starter_roster_verified_on_both_platforms': True, 'android_legacy_starter_upgrade_verified': True,
              'home_fish_heaven_absent': True,
              'home_positions_distinct': True, 'quest_top_list_main': True, 'quest_catalog_readonly': True,
              'quest_contest_area_locked': True, 'quest_contest_quest_count': 23,
              'quest_tutorial_context': True, 'quest_tutorial_pending': True,
              'fresh_tutorial_catalog': {'groups': 6, 'areas': 126, 'quests': 941},
              'initial_inventory_master_backed': True, 'default_unit_complete': True,
              'initial_inventory_readonly': True, 'starter_inventory_persisted': True,
              'initial_inventory': {'cards': 17, 'items': 2, 'default_unit_slots': 5},
              'quest_list_asset': True, 'quest_list_asset_tutorial_full': True,
              'quest_list_asset_tutorial_short': True, 'quest_list_asset_ordinary_buddy_name': True,
              'quest_list_asset_readonly': True, 'quest_list_asset_rental_rejected': True,
              'quest_list_asset_count': 5,
              'tutorial_replay_short': True, 'tutorial_replay_full': True, 'tutorial_replay_canonical': True,
              'tutorial_replay_master_references': True, 'tutorial_replay_readonly': True,
              'tutorial_replay_assets_covered': True,
              'tutorial_replay_asset_counts': {'short': 8, 'full': 9},
              'tutorial_replay_chart_counts': {'short': 158, 'full': 156},
              'tutorial_replay_scores': {'short': 8813, 'full': 10717},
              'tutorial_replay_mode': 'recorded_public_fixed_demo', 'general_live_engine_implemented': False,
              'tutorial_continuation_completed_step': 150, 'tutorial_lesson_reward_once': True,
              'tutorial_enhancement_pieces': 40, 'tutorial_new_deck_number': 2,
              'tutorial_message_saved_finished': True, 'tutorial_continuation_persisted': True,
              'tutorial_continuation_identity_preserved': True, 'tutorial_continuation_sessions_preserved': True,
              'tutorial_continuation_settings_preserved': True,
              'android_version3_inventory_upgraded': True,
              'android_legacy_home_positions_upgraded': True, 'android_version2_home_positions_upgraded': True,
              'android_upgrade_home1_preserved': True, 'android_upgrade_unknown_fields_preserved': True,
              'android_upgrade_tutorial_preserved': True,
              'ordinary_lesson_persisted': True, 'ordinary_lesson_clock_persisted': True,
              'ordinary_lesson_resources_persisted': True, 'ordinary_lesson_identity_preserved': True,
              'ordinary_lesson_sessions_preserved': True, 'ordinary_lesson_settings_preserved': True,
              'ordinary_lesson_policy': 'initial_main_area_base_only',
              'ordinary_lesson_step_seconds': 10, 'ordinary_lesson_window_hours': 12,
              'ordinary_lesson_step_rewards': {'gold': 5, 'manager_exp': 8, 'enhance_item': 3},
              'story_catalog_event': True, 'story_catalog_extra': True,
              'story_catalog_home_consistent': True, 'story_catalog_readonly': True,
              'story_catalog_baseline': 'fresh-official-2026-10-25',
              'story_catalog_event_count': 55, 'story_catalog_event_episode_count': 272,
              'story_catalog_extra_part_count': 3, 'story_catalog_extra_story_count': 41,
              'story_catalog_extra_episode_count': 154, 'story_read_and_reward_implemented': True,
              'story_read_scope': 'frozen_public_catalog_425_story_ids',
              'story_read_supported_methods': ['Read', 'ReadEvent', 'ReadExtra'],
              'story_read_no_reward_count': 143, 'story_read_free_stone_count': 282,
              'story_read_reward': {'resource_type': 15, 'free_stone': 30, 'once_per_story': True},
              'story_read_persisted': True, 'story_read_clock_persisted': True,
