               'story_rows_added', 'free_stone_delta')) == (425, 143, 282, 2, 30)
          assert all(story_read.get(key) is True for key in
              ('event_skipped_reward_once', 'extra_completed_without_reward', 'retries_and_cross_route_no_grant',
               'authoritative_common', 'exact_snapshot_projection', 'lesson_clock_preserved',
               'catalog_eligibility_preserved'))
          assert all(engine.get(key) is True for key in
              ('appearance_persisted', 'appearance_clock_preserved', 'appearance_resources_preserved',
               'appearance_identity_preserved', 'appearance_sessions_preserved', 'appearance_settings_preserved',
               'appearance_restart_no_change'))
          appearance = engine['appearance']
          assert appearance['platform'] == 'macOS frozen'
          assert tuple(appearance.get(key) for key in
              ('rpc_count', 'checked_costume_count', 'checked_hair_count', 'preference_field_count')) == (5, 2, 2, 4)
          assert all(appearance.get(key) is True for key in
              ('single_costume_check', 'single_hair_check', 'bulk_check', 'favorite_set', 'live_set',
               'exact_common', 'exact_snapshot_projection', 'retries_no_change', 'master_compatible_owned',
               'empty_bulk_no_change'))
          continuation = engine['tutorial_continuation']
          assert (continuation['completed_step'], continuation['enhancement_cost'], continuation['deck_number_allocated']) == (150, 40, 2)
          assert all(continuation.get(key) is True for key in
              ('lesson_reward_once', 'enhancement_master_projection', 'original_deck_preserved',
               'tutorial_message_saved_finished', 'unrelated_snapshot_preserved'))
          assert engine.get('quest_catalog_first_quest')
          assert tuple(engine.get(key) for key in
              ('quest_catalog_group_count', 'quest_catalog_area_count', 'quest_catalog_quest_count')) == (6, 126, 941)
          assert engine.get('quest_contest_quest_count') == 23
          assert tuple(engine.get(key) for key in
              ('initial_card_count', 'initial_item_count', 'default_unit_slot_count')) == (17, 2, 5)
          assert all(engine.get(key) is True for key in
              ('quest_list_asset', 'quest_list_asset_tutorial_full', 'quest_list_asset_tutorial_short',
               'quest_list_asset_ordinary_buddy_name', 'quest_list_asset_readonly', 'quest_list_asset_rental_rejected'))
          assert engine.get('quest_list_asset_count') == 5
          assert all(engine.get(key) is True for key in
              ('tutorial_replay_short', 'tutorial_replay_full', 'tutorial_replay_canonical',
               'tutorial_replay_master_references', 'tutorial_replay_readonly', 'tutorial_replay_assets_covered'))
          assert tuple(engine.get(key) for key in
              ('quest_list_asset_tutorial_short_count', 'quest_list_asset_tutorial_full_count',
               'tutorial_replay_short_charts', 'tutorial_replay_full_charts',
               'tutorial_replay_short_score', 'tutorial_replay_full_score')) == (8, 9, 158, 156, 8813, 10717)
          PY
          .venv/bin/python -m zipfile -c data/dist/IdolyPride-Local-Server-macOS-QA.zip data/macos-evidence
          if [[ "$IDOLY_ARTIFACT_ONLY" != true ]]; then
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" \
            --jq '.draft and .tag_name == "local-server-v0.3.0"' | grep -qx true
          gh release upload "$IDOLY_SERVER_TAG" --repo "$GH_REPO" --clobber \
            data/dist/IdolyPride-Local-Server-macOS-arm64.app.zip data/dist/IdolyPride-Local-Server-macOS-QA.zip
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" > "$RUNNER_TEMP/idoly-macos-upload.json"
          .venv/bin/python - "$RUNNER_TEMP/idoly-macos-upload.json" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text())
          assert release['draft'] is True and release['tag_name'] == os.environ['IDOLY_SERVER_TAG']
          assets = {asset['name']: asset for asset in release['assets']}
          for name in ('IdolyPride-Local-Server-macOS-arm64.app.zip', 'IdolyPride-Local-Server-macOS-QA.zip'):
              path = Path('data/dist') / name
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert assets[name]['size'] == path.stat().st_size and assets[name].get('digest') == 'sha256:' + digest
              if name.endswith('.app.zip'):
                  with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                      output.write('app_sha256=' + digest + '\n')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-server-candidate-and-native-evidence-v${{ env.IDOLY_APP_VERSION }}
          path: |
            data/macos-evidence
            data/dist/IdolyPride-Local-Server-macOS-arm64.app.zip
            data/dist/IdolyPride-Local-Server-macOS-QA.zip
          if-no-files-found: warn

  verify:
