                  'android_physical_arm64_tested': False,
                  'android_arm64_qa_scope': 'pending_native_arm_environment',
                  'android_root_and_cpu_graphics_preflight': True,
                  'request_id_receipts_persisted': True, 'repeated_request_exact_response': True,
                  'seed_and_started_time_preserved_after_restart': True,
                  'first_clear_reward_once': {'enhance_item': 290, 'gold': 500, 'free_stone': 50,
                      'ac-1-visual-02': 1, 'manager_exp': 50, 'card_exp': [40] * 5},
                  'new_request_after_clear_grants_reward_or_exp': False,
                  'chart_count': 183, 'beat_count': 855,
                  'protected_identity_sessions_settings_and_lesson_clock_preserved': True,
                  'game_client_ordinary_live_playback_tested': False,
              },
              'actual_game_client_gameplay_tested': False,
          }, indent=2) + '\n')
          PY
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" \
            --jq '.draft and .tag_name == "local-server-v0.3.0"' | grep -qx true
          gh release upload "$IDOLY_SERVER_TAG" --repo "$GH_REPO" --clobber \
            data/release-verification/SHA256SUMS data/release-verification/RELEASE-VERIFICATION.json
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" \
            --jq '.draft and .tag_name == "local-server-v0.3.0"' | grep -qx true
          {
            echo 'All three server deliverables and platform QA evidence are present with verified SHA-256 digests.'
            echo 'The dedicated local-server-v0.3.0 release remains a draft; the existing client release was not modified.'
            echo 'Home/Tutorial support remains partial. Actual IDOLY PRIDE game-client gameplay is not covered by these app checks.'
          } >> "$GITHUB_STEP_SUMMARY"
