            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            echo 'options=-accel on' >> "$GITHUB_OUTPUT"
            echo 'disable_linux_hw_accel=false' >> "$GITHUB_OUTPUT"
          else
            echo 'KVM is absent; running the same emulator checks with software acceleration.'
            echo 'options=-accel off' >> "$GITHUB_OUTPUT"
            echo 'disable_linux_hw_accel=true' >> "$GITHUB_OUTPUT"
