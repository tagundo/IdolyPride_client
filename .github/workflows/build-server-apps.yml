name: Build native server candidates or draft assets

on:
  workflow_dispatch:
    inputs:
      ios_unified:
        description: Build an Actions-only integrated iPhone/iPad IPA and run a disposable iOS Simulator core probe
        type: boolean
        default: false
      artifact_only:
        description: Build Actions-only candidates for separate Android native runtime QA; leave the release draft untouched
        type: boolean
        default: false
      fixed_payload_patch:
        description: Build v0.3.2 Actions-only candidates with the exact previously verified v0.3.0 data payload
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-server-apps-${{ inputs.ios_unified && 'ios-unified' || (inputs.fixed_payload_patch && 'v0.3.2' || 'v0.3.0') }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  IDOLY_SERVER_TAG: ${{ inputs.fixed_payload_patch && 'local-server-v0.3.2' || 'local-server-v0.3.0' }}
  IDOLY_APP_VERSION: ${{ inputs.fixed_payload_patch && '0.3.2' || '0.3.0' }}
  IDOLY_APP_VERSION_CODE: ${{ inputs.fixed_payload_patch && '21' || '19' }}
  IDOLY_PAYLOAD_NAME: ${{ inputs.fixed_payload_patch && 'IdolyPride-ServerData-v0.3.2.zip' || 'IdolyPride-ServerData-v0.3.0.zip' }}
  IDOLY_PATCH_CANDIDATE: ${{ inputs.fixed_payload_patch }}

jobs:
  prepare:
    if: ${{ !inputs.ios_unified }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      payload_sha256: ${{ steps.payload.outputs.payload_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep the fixed-data patch path Actions-only
        env:
          IDOLY_ARTIFACT_ONLY: ${{ inputs.artifact_only }}
        run: |
          if [ "$IDOLY_PATCH_CANDIDATE" = true ] && [ "$IDOLY_ARTIFACT_ONLY" != true ]; then
            echo 'The fixed-data patch path cannot create or upload to a release.' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install locked Linux preparation and test dependencies
        run: uv sync --locked --all-extras --python 3.12
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build the pinned Linux local-rules library for source validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/preparation-evidence
          python3 native-live-engine/scripts/build.py --target linux --go "$(command -v go)" \
            --output data/native-live/linux --cache data/native-live-cache \
            > data/preparation-evidence/live-engine-build.json
          python3 native-live-engine/scripts/check_abi.py \
            --library data/native-live/linux/libidoly_live.so \
            --report data/preparation-evidence/live-engine-abi.json
          echo "IDOLY_LIVE_LIBRARY=$GITHUB_WORKSPACE/data/native-live/linux/libidoly_live.so" >> "$GITHUB_ENV"
          echo "IDOLY_LIVE_MASTER_DIR=$GITHUB_WORKSPACE/data/master-json" >> "$GITHUB_ENV"
      - name: Download the pinned existing public server-data asset
        if: ${{ !inputs.fixed_payload_patch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/ci-input data/dist data/preparation-evidence
          gh api "repos/$GH_REPO/releases/assets/726977995" \
            --header 'Accept: application/octet-stream' \
            > data/ci-input/ServerData-source.zip
          printf '%s  %s\n' \
            '2df8ca651fbb3104b10910dc60a2a87f8cac1db3b5defff56eb4703c769be6b3' \
            'data/ci-input/ServerData-source.zip' | sha256sum --check --strict
          uv run --locked python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          with ZipFile('data/ci-input/ServerData-source.zip') as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Source ServerData ZIP failed CRC validation')
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'data':
                      raise SystemExit('Unexpected source archive path')
              archive.extractall(Path.cwd())
          PY
      - name: Archive anonymous title-screen rules and help
        if: ${{ !inputs.fixed_payload_patch }}
        run: >-
          uv run --locked python tools/archive_public_text.py
          --descriptor-set data/protocol/idolypride-6.1.1.pb
          --output data/public-fixtures
      - name: Archive the pinned public official tutorial replay records
        if: ${{ !inputs.fixed_payload_patch }}
        run: >-
          uv run --locked python tools/archive_tutorial_replays.py
          --descriptor-set data/protocol/idolypride-6.1.1.pb
          --master-tag data/original-master/master-tag.json
          --output data/public-tutorial
      - name: Archive the pinned public story eligibility catalogs
        if: ${{ !inputs.fixed_payload_patch }}
        run: >-
          uv run --locked python tools/archive_story_catalog.py
          --descriptor-set data/protocol/idolypride-6.1.1.pb
          --master-tag data/original-master/master-tag.json
          --output data/public-story
      - name: Build and verify the native-app payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/ci-input data/dist data/preparation-evidence
          if [[ "$IDOLY_PATCH_CANDIDATE" == true ]]; then
            gh api "repos/$GH_REPO/releases/assets/732944285" \
              --header 'Accept: application/octet-stream' \
              > data/ci-input/ServerData-fixed.zip
            uv run --locked python tools/prepare_fixed_patch_payload.py \
              --source data/ci-input/ServerData-fixed.zip \
              --output "data/dist/$IDOLY_PAYLOAD_NAME" --workspace . \
              --report data/dist/server-data-build.json
          else
            uv run --locked --all-extras python tools/build_server_payload.py \
              --output "data/dist/$IDOLY_PAYLOAD_NAME" \
              | tee data/dist/server-data-build.json
          fi
          uv run --locked python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZipFile

          payload = Path('data/dist') / os.environ['IDOLY_PAYLOAD_NAME']
          with ZipFile(payload) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Prepared payload failed CRC validation')
              archive.extractall(Path.cwd())
          with payload.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('payload_sha256=' + digest + '\n')
          print('Prepared payload SHA-256: ' + digest)
          PY
      - name: Run all core and portable platform checks
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --all-extras pytest -q tests android-server/ci macos-server/tests native-live-engine/tests \
            | tee data/preparation-evidence/tests.txt
          uv run --locked python -m compileall -q src tools android-server/app/src/main/python macos-server
      - name: Verify production startup with pure Python protobuf and no grpcio import
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import importlib.abc
          import os
          from pathlib import Path
          import runpy
          import sys

          class NoGrpc(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname == 'grpc' or fullname.startswith('grpc.'):
                      raise RuntimeError('Embedded engine attempted to import grpcio')

          sys.meta_path.insert(0, NoGrpc())
          sys.path.insert(0, str(Path('macos-server').resolve()))
          sys.argv = ['macos-server/engine.py', '--smoke', '--data-dir',
              str(Path(os.environ['RUNNER_TEMP']) / 'idoly-pure-runtime'),
              '--server-data', str(Path('data/dist') / os.environ['IDOLY_PAYLOAD_NAME']),
              '--report', 'data/preparation-evidence/pure-python-engine-smoke.json',
              '--live-engine-library', os.environ['IDOLY_LIVE_LIBRARY']]
          runpy.run_path('macos-server/engine.py', run_name='__main__')
          PY
      - name: Create or require the dedicated draft release
        if: ${{ !inputs.artifact_only }}
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          IDOLY_RELEASE_IDS="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "local-server-v0.3.0") | .id')"
          if [[ "$IDOLY_RELEASE_IDS" == *$'\n'* ]]; then
            echo 'More than one release has the target server tag' >&2
            exit 1
          fi
          if [[ -n "$IDOLY_RELEASE_IDS" ]]; then
            IDOLY_RELEASE_ID="$IDOLY_RELEASE_IDS"
            gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" > "$RUNNER_TEMP/idoly-existing-draft.json"
            jq -e --arg tag "$IDOLY_SERVER_TAG" '.draft == true and .tag_name == $tag' \
              "$RUNNER_TEMP/idoly-existing-draft.json" > /dev/null
          else
            jq -n --arg tag "$IDOLY_SERVER_TAG" --arg commit "$GITHUB_SHA" \
              '{tag_name:$tag,target_commitish:$commit,name:"Idoly Pride local server apps v0.3.0",draft:true,
                body:("Experimental Android arm64 server APK and Apple Silicon macOS app with bundled public data. " +
                      "Includes ordinary lessons, local inbox/friend lists and the frozen public story catalogs with once-only read/skip rewards, owned costume/hair preferences and acknowledgement APIs. Adds an explicit default-off first-main-live local-rules experiment with once-only first-clear rewards and durable retry receipts. Official score equivalence remains unverified. " +
                      "Android emulator and macOS native app evidence are attached after their checks pass. " +
                      "This release remains a draft. Source commit: " + $commit)}' \
              > "$RUNNER_TEMP/idoly-new-draft.json"
            IDOLY_RELEASE_ID="$(gh api --method POST "repos/$GH_REPO/releases" \
              --input "$RUNNER_TEMP/idoly-new-draft.json" --jq '.id')"
          fi
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" \
            --jq '.draft and .tag_name == "local-server-v0.3.0"' | grep -qx true
          echo "release_id=$IDOLY_RELEASE_ID" >> "$GITHUB_OUTPUT"
      - name: Upload the tested payload to the draft only
        if: ${{ !inputs.artifact_only }}
        shell: bash
        env:
          IDOLY_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" \
            --jq '.draft and .tag_name == "local-server-v0.3.0"' | grep -qx true
          gh release upload "$IDOLY_SERVER_TAG" --repo "$GH_REPO" --clobber "data/dist/$IDOLY_PAYLOAD_NAME"
          gh api "repos/$GH_REPO/releases/$IDOLY_RELEASE_ID" > "$RUNNER_TEMP/idoly-payload-upload.json"
          uv run --locked python - "$RUNNER_TEMP/idoly-payload-upload.json" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text())
          assert release['draft'] is True and release['tag_name'] == os.environ['IDOLY_SERVER_TAG']
          name = os.environ['IDOLY_PAYLOAD_NAME']
          asset = next(asset for asset in release['assets'] if asset['name'] == name)
          path = Path('data/dist') / name
          with path.open('rb') as stream:
              digest = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
          assert asset['size'] == path.stat().st_size and asset.get('digest') == digest
          print('GitHub verified the payload size and SHA-256')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: server-data-v${{ env.IDOLY_APP_VERSION }}
          path: |
            data/dist/${{ env.IDOLY_PAYLOAD_NAME }}
            data/dist/server-data-build.json
            data/protocol/idolypride-6.1.1.pb
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-preparation-evidence-v${{ env.IDOLY_APP_VERSION }}
          path: data/preparation-evidence
          if-no-files-found: warn

  android:
    # Release uploads stay paused until native ARM runtime QA replaces the
    # translated gate. artifact_only builds bytes for that separate QA and
    # never uploads Android APKs to the release or claims runtime success.
    if: ${{ !inputs.ios_unified && (inputs.artifact_only || vars.IDOLY_ANDROID_NATIVE_RUNTIME_QA_READY == 'true') }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    outputs:
      apk_sha256: ${{ steps.publish.outputs.apk_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      IDOLY_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      IDOLY_PAYLOAD_SHA: ${{ needs.prepare.outputs.payload_sha256 }}
      IDOLY_ARTIFACT_ONLY: ${{ inputs.artifact_only }}
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare runner disk and optional translated QA graphics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/android-server-qa/environment
          df -h . > data/android-server-qa/environment/disk-before.txt
          sudo rm -rf /usr/share/dotnet /opt/ghc
          # The ephemeral runner may include several unused NDK revisions.
          # All native builds below pin 26.3 and verify its source.properties.
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          directory = Path(os.environ['ANDROID_HOME']) / 'ndk'
          if directory.is_dir():
              for child in directory.iterdir():
                  if child.is_dir() and child.name != '26.3.11579264':
                      shutil.rmtree(child)
          PY
          df -h . > data/android-server-qa/environment/disk-after.txt
          if [[ "$IDOLY_ARTIFACT_ONLY" != true ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb xauth mesa-utils \
              libgl1-mesa-dri libegl-mesa0 mesa-vulkan-drivers libpulse0
            Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp -ac \
              > data/android-server-qa/environment/xvfb.log 2>&1 &
            for attempt in $(seq 1 20); do
              if glxinfo -B > data/android-server-qa/environment/host-glxinfo.txt 2>&1; then break; fi
              sleep 1
            done
            grep -E 'OpenGL renderer string:.*llvmpipe' data/android-server-qa/environment/host-glxinfo.txt
          fi
      - uses: actions/download-artifact@v4
        with:
          name: server-data-v${{ env.IDOLY_APP_VERSION }}
          path: data
      - name: Prepare verified host catalog references before Android build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from zipfile import ZipFile

          payload = Path('data/dist') / os.environ['IDOLY_PAYLOAD_NAME']
          expected = os.environ['IDOLY_PAYLOAD_SHA']
          if not re.fullmatch(r'[0-9a-f]{64}', expected) or not payload.is_file():
              raise SystemExit('Verified Android QA payload or its expected SHA-256 is missing')
          with payload.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('Android QA payload failed its preparation SHA-256 check')
          with ZipFile(payload) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Android QA payload failed ZIP CRC validation')
              manifest = json.loads(archive.read('data/payload-manifest.json'))
              tables = manifest.get('tables')
              if (not isinstance(tables, dict) or not tables
                      or any(not re.fullmatch(r'[A-Za-z][A-Za-z0-9]*', name) for name in tables)
                      or len(tables) != 40
                      or not {'CardLevel', 'ManagerLevel', 'Consumption', 'Message', 'MessageGroup', 'EventStory', 'ExtraStoryPart', 'ExtraStory', 'Story',
                              'QuestPressure', 'QuestAudienceAdvantage', 'ComboAdvantage', 'QuestStaminaConsumption', 'Mission'}.issubset(tables)):
                  raise SystemExit('Android QA payload has no complete progression master catalog')
              required = ('protocol/idolypride-6.1.1.pb', 'master-json/!version.txt', *(f'master-json/{name}.json' for name in tables),
                          'public-tutorial/manifest.json', 'public-tutorial/tutorial-short.pb', 'public-tutorial/tutorial-full.pb',
                          'public-story/manifest.json', 'public-story/story-list-event.pb', 'public-story/story-list-extra.pb')
              for relative in required:
                  content = archive.read('data/' + relative)
                  if not content or relative.endswith('.json') and not json.loads(content):
                      raise SystemExit('Required Android QA reference is empty: ' + relative)
                  destination = Path('data') / relative
                  if destination.is_file() and destination.read_bytes() != content:
                      raise SystemExit('Host Android QA reference differs from the verified payload: ' + relative)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(content)
          if not all((Path('data') / relative).is_file() for relative in required):
              raise SystemExit('Required Android QA schema or catalog reference is missing')
          print(f'Prepared the verified schema, {len(tables)} canonical tables and three public tutorial replay files')
          PY
      - name: Install Android SDK and host QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
          if [[ "$IDOLY_ARTIFACT_ONLY" != true ]]; then sdkmanager 'emulator'; fi
          uv sync --locked --python 3.12
          mkdir -p data/android-server-qa data/dist
          chmod +x android-server/gradlew
          python -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          echo "IDOLY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Build stock-toolchain Android local-rules libraries and optional translated QA preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/native-live/jni/arm64-v8a data/native-live/jni/x86_64 data/android-server-qa/native-live-engine
          for target in android android-x86_64; do
            if [[ "$IDOLY_ARTIFACT_ONLY" == true && "$target" == android-x86_64 ]]; then continue; fi
            python native-live-engine/scripts/build.py --target "$target" --go "$(command -v go)" \
              --ndk "$ANDROID_HOME/ndk/26.3.11579264" --output "data/native-live/$target" \
              --cache data/native-live-cache
            cp "data/native-live/$target/build-report.json" "data/android-server-qa/native-live-engine/$target-build.json"
          done
          cp data/native-live/android/libidoly_live.so data/native-live/jni/arm64-v8a/
          if [[ "$IDOLY_ARTIFACT_ONLY" != true ]]; then
            cp data/native-live/android-x86_64/libidoly_live.so data/native-live/jni/x86_64/
            python tools/emulator_environment_probe/build.py --sdk "$ANDROID_HOME" \
              --ndk "$ANDROID_HOME/ndk/26.3.11579264" --java "$JAVA_HOME/bin" \
              --output data/android-server-qa/environment/EnvironmentProbe.apk \
              > data/android-server-qa/environment/build-report.json
          fi
          git diff --exit-code -- native-live-engine/go.mod native-live-engine/go.sum
      - name: Build the arm64 candidate and optional separate x86_64 QA APK
        shell: bash
        run: |
          set -euo pipefail
          IDOLY_PAYLOAD="$GITHUB_WORKSPACE/data/dist/$IDOLY_PAYLOAD_NAME"
          ./android-server/gradlew -p android-server :app:assembleDebug \
            --no-daemon --console=plain --stacktrace \
            -PbuildPython="$IDOLY_BUILD_PYTHON" -PserverData="$IDOLY_PAYLOAD" -PliveEngineDir="$GITHUB_WORKSPACE/data/native-live/jni" -PserverAbi=arm64-v8a -PserverVersionName="$IDOLY_APP_VERSION" -PserverVersionCode="$IDOLY_APP_VERSION_CODE" \
            | tee data/android-server-qa/build-arm64.log
          cp android-server/app/build/outputs/apk/debug/app-debug.apk data/dist/IdolyPride-Local-Server-Android.apk
          if [[ "$IDOLY_ARTIFACT_ONLY" != true ]]; then
            ./android-server/gradlew -p android-server :app:clean :app:assembleDebug \
              --no-daemon --console=plain --stacktrace \
              -PbuildPython="$IDOLY_BUILD_PYTHON" -PserverData="$IDOLY_PAYLOAD" -PliveEngineDir="$GITHUB_WORKSPACE/data/native-live/jni" -PserverAbi=x86_64 -PserverVersionName="$IDOLY_APP_VERSION" -PserverVersionCode="$IDOLY_APP_VERSION_CODE" \
              | tee data/android-server-qa/build-x86_64.log
            cp android-server/app/build/outputs/apk/debug/app-debug.apk data/dist/IdolyPride-Local-Server-Android-x86_64-QA.apk
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            data/dist/IdolyPride-Local-Server-Android.apk > data/android-server-qa/arm64-signature.txt
          if [[ "$IDOLY_ARTIFACT_ONLY" != true ]]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
              data/dist/IdolyPride-Local-Server-Android-x86_64-QA.apk > data/android-server-qa/x86_64-signature.txt
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          reports = []
          notices = ('LICENSE', 'NOTICE', 'third-party-licenses/Go-LICENSE',
              'third-party-licenses/Protobuf-LICENSE', 'third-party-licenses/YAML-LICENSE',
              'third-party-licenses/YAML-NOTICE')
          targets = [('', 'android', 'arm64-v8a')]
          if os.environ['IDOLY_ARTIFACT_ONLY'] != 'true':
              targets.append(('-x86_64-QA', 'android-x86_64', 'x86_64'))
          for suffix, target, abi in targets:
              apk = Path('data/dist/IdolyPride-Local-Server-Android' + suffix + '.apk')
              build = json.loads(Path('data/native-live', target, 'build-report.json').read_text())
              assert build['abi_version'] == 1 and build['ruleset'] == 'live-v5'
              assert build['android_abi'] == abi and build['elf_16k_load_alignment_verified'] is True
              assert build['official_score_equivalence'] is False and build['no_db_or_server_dependencies'] is True
              with ZipFile(apk) as archive:
                  names = [name for name in archive.namelist() if name.endswith('/libidoly_live.so')]
                  assert names == ['lib/' + abi + '/libidoly_live.so']
                  raw = archive.read(names[0])
                  assert hashlib.sha256(raw).hexdigest() == build['library_sha256']
                  for relative in notices:
                      assert archive.read('assets/native-live-engine/' + relative) == Path('native-live-engine', relative).read_bytes()
              reports.append({'apk': apk.name, 'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
                  'android_abi': abi, 'library_sha256': build['library_sha256'],
                  'license_files_verified': len(notices), 'exact_unstripped_library': True})
          Path('data/android-server-qa/native-live-engine/apk-audit.json').write_text(json.dumps(reports, indent=2) + '\n')
          PY
      - name: Record candidate bytes and source without claiming Android execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('data/dist/IdolyPride-Local-Server-Android.apk')
          payload = Path('data/dist') / os.environ['IDOLY_PAYLOAD_NAME']
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          payload_sha = digest(payload)
          assert payload_sha == os.environ['IDOLY_PAYLOAD_SHA']
          with ZipFile(payload) as archive:
              manifest = json.loads(archive.read('data/payload-manifest.json'))
              assert len(manifest['tables']) == 40 and 'Mission' in manifest['tables']
          with ZipFile(apk) as archive:
              assert archive.read('assets/ServerData.zip') == payload.read_bytes()
              assert archive.testzip() is None
          report = {'schema': 1, 'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'artifact_only': os.environ['IDOLY_ARTIFACT_ONLY'] == 'true',
              'app_version': os.environ['IDOLY_APP_VERSION'],
              'app_version_code': int(os.environ['IDOLY_APP_VERSION_CODE']),
