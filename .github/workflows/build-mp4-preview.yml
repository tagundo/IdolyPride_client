name: Build offline MP4 APK and IPA preview (draft only)
# Both packages and their preservation/codec proofs use the same source SHA.

on:
  push:
    branches: [feat/ios-unified-server]
    paths:
      - .github/workflows/build-mp4-preview.yml
      - tools/stage_mp4_preview.py
      - tests/test_mp4_preview_delivery.py
      - tests/test_mp4_field_reference_abi.py
      - tests/test_mp4_photography_bridge.py
      - tests/test_mp4_replay_factories.py
      - tests/test_mp4_small_stack.py
      - tests/test_mp4_camera_owner.py
      - tests/test_mp4_timeline_camera.py
      - tests/test_mp4_timeline_audio.py
      - tests/test_mp4_timeline_camera_adapter.py
      - tests/test_mp4_timeline_audio_adapter.py
      - tests/test_mp4_selected_controller.py
      - tests/test_mp4_controller_diagnostics.py
      - tools/package_android_unified.py
      - tests/test_android_unified_badging.py
      - tests/test_ios_mp4_queue_host.py
      - tests/test_ios_probe_process_termination.py
  workflow_dispatch:
    inputs:
      upload_draft:
        description: Stage the exact-source APK and IPA in a new draft after current-source codec QA; never publish
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mp4-preview-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  android-build:
    name: android-build
    if: ${{ github.ref == 'refs/heads/feat/ios-unified-server' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_sha: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check draft delivery guards
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 protobuf==6.33.0 pycryptodome==3.23.0 unicorn==2.1.4 capstone==5.0.9
          python -B -m pytest -q -p no:cacheprovider tests/test_mp4_preview_delivery.py tests/test_mp4_field_reference_abi.py tests/test_mp4_photography_bridge.py tests/test_mp4_replay_factories.py tests/test_mp4_small_stack.py tests/test_mp4_camera_owner.py tests/test_mp4_timeline_camera.py tests/test_mp4_timeline_audio.py tests/test_mp4_timeline_camera_adapter.py tests/test_mp4_timeline_audio_adapter.py tests/test_mp4_selected_controller.py tests/test_mp4_controller_diagnostics.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install exact Android build tools
        run: sdkmanager 'platforms;android-34' 'platforms;android-35' 'build-tools;34.0.0' 'ndk;26.3.11579264'
      - name: Fetch immutable three-language client/server inputs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/stage_shared_preview.py fetch --directory "$RUNNER_TEMP/mp4-android-inputs"
      - name: Build current native bridge and signed MP4 preview APK
        env:
          IDOLY_RELEASE_VERSION: 2026.11.21.9
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/mp4-native" "$RUNNER_TEMP/mp4-android-output"
          python -B client-presentation/native/build_native.py --source-commit "$SOURCE_SHA" \
            --ndk "$ANDROID_HOME/ndk/26.3.11579264" --cache-dir "$RUNNER_TEMP/mp4-native-deps" \
            --output "$RUNNER_TEMP/mp4-native/libidoly_presentation.so"
          umask 077
          printf '%s\n' android > "$RUNNER_TEMP/mp4-public-development-password.txt"
          python -B tools/package_android_unified.py --prototype \
            --source-root "$PWD" --source-commit "$SOURCE_SHA" \
            --client-apk "$RUNNER_TEMP/mp4-android-inputs/client-ko.apk" \
            --client-ja-apk "$RUNNER_TEMP/mp4-android-inputs/client-ja.apk" \
            --client-en-apk "$RUNNER_TEMP/mp4-android-inputs/client-en.apk" \
            --server-apk "$RUNNER_TEMP/mp4-android-inputs/server.apk" \
            --chaquopy-jar "$RUNNER_TEMP/mp4-android-inputs/chaquopy.jar" \
            --apkeditor "$RUNNER_TEMP/mp4-android-inputs/APKEditor.jar" \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" --jdk-bin "$JAVA_HOME/bin" \
            --keystore android-diagnostics/local-diagnostics-development.keystore \
            --password-file "$RUNNER_TEMP/mp4-public-development-password.txt" \
            --native-bridge "$RUNNER_TEMP/mp4-native/libidoly_presentation.so" \
            --native-receipt "$RUNNER_TEMP/mp4-native/build-receipt.json" \
            --output "$RUNNER_TEMP/mp4-android-output/IdolyPride-Unified-2026.11.21.9-prototype.apk"
          python -B tools/stage_mp4_preview.py check-android --source "$SOURCE_SHA" \
            --directory "$RUNNER_TEMP/mp4-android-output"
          test -z "$(git status --porcelain)"
      - name: Retain APK and source/signature/preservation proof even if staging is disabled
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp4-android-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mp4-android-output
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  android-draft-stage:
    name: android-draft-stage
    needs: [android-build]
    if: ${{ success() && (github.event_name == 'push' || inputs.upload_draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the current Android producer and both current-source codecs, then stage a separate Android-only draft
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_ARTIFACT_ID: ${{ needs.android-build.outputs.artifact_id }}
          ANDROID_ARTIFACT_SHA: ${{ needs.android-build.outputs.artifact_sha }}
        run: >-
          python -B tools/stage_mp4_preview.py stage-android --source "$SOURCE_SHA"
          --work "$RUNNER_TEMP/mp4-android-draft-staging"
      - name: Retain the Android-only draft URL and complete release-asset readback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp4-android-draft-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mp4-android-draft-staging/android-draft-staging-proof.json
          if-no-files-found: ignore
          retention-days: 14

  ios-build:
    name: ios-build
    if: ${{ github.ref == 'refs/heads/feat/ios-unified-server' }}
    runs-on: macos-15
    timeout-minutes: 55
    # The pinned stock IPA is an unpublished input asset. GitHub requires write
    # permission to read it; only read-only input preparation receives GH_TOKEN.
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_sha: ${{ steps.artifact.outputs.artifact-digest }}
    env:
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned original game, runtime and server-data inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B ios-unified/fetch_inputs.py --output "$RUNNER_TEMP/mp4-ios-inputs"
      - name: Install exact build verification dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 unicorn==2.1.4 capstone==5.0.9 pycryptodome==3.23.0 UnityPy==1.25.4 astc-encoder-py==0.1.12 Pillow==13.0.0
          python -m pip install --no-index "$RUNNER_TEMP"/mp4-ios-inputs/wheels/*.whl
      - name: Compile the real iOS and Simulator MP4 interface and exercise the Apple codecs
        run: |
          mkdir "$RUNNER_TEMP/mp4-ios-preflight"
          python -B -m pytest -q tests/test_mp4_queue.py tests/test_ios_mp4_queue_host.py tests/test_ios_mp4_options.py tests/test_ios_mp4_menu_readiness.py tests/test_ios_probe_account_guard.py tests/test_ios_probe_process_termination.py tests/test_mp4_runtime_type_validation.py tests/test_mp4_field_reference_abi.py tests/test_mp4_photography_bridge.py tests/test_mp4_replay_factories.py tests/test_mp4_camera_owner.py tests/test_mp4_timeline_camera.py tests/test_mp4_timeline_audio.py tests/test_mp4_timeline_camera_adapter.py tests/test_mp4_timeline_audio_adapter.py tests/test_mp4_selected_controller.py tests/test_mp4_controller_diagnostics.py
          python -B ios-unified/native/test_mp4_ui_compile.py > "$RUNNER_TEMP/mp4-ios-preflight/mp4-ui-compile.json"
          python -B ios-unified/native/test_mv_encoder.py --output-directory "$RUNNER_TEMP/mp4-apple-codec"
      - name: Build current-source IPA and verify five cold language processes in a fresh Simulator
        env:
          GH_TOKEN: ${{ github.token }}
          IDOLY_RELEASE_VERSION: 2026.11.21.9
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          python -B ios-unified/ci_build.py --inputs "$RUNNER_TEMP/mp4-ios-inputs" \
            --work "$RUNNER_TEMP/mp4-ios-build" --output "$RUNNER_TEMP/mp4-ios-output" \
            --source-commit "$SOURCE_SHA"
          cp "$RUNNER_TEMP/mp4-ios-preflight/mp4-ui-compile.json" "$RUNNER_TEMP/mp4-ios-output/mp4-ui-compile.json"
          cp "$RUNNER_TEMP/mp4-apple-codec/report.json" "$RUNNER_TEMP/mp4-ios-output/mp4-codec-report.json"
          test -z "$(git status --porcelain)"
      - name: Retain failed-build diagnostics and small Apple codec evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp4-ios-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mp4-ios-output/*.json
            ${{ runner.temp }}/mp4-ios-preflight
            ${{ runner.temp }}/mp4-apple-codec
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the IPA only after its complete Simulator probe passes
        id: artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mp4-ios-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mp4-ios-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-stage:
    name: draft-stage
    needs: [android-build, ios-build]
    if: ${{ success() && (github.event_name == 'push' || inputs.upload_draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require current-source codec QA, verify both current-run artifacts and stage only a new draft
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_ARTIFACT_ID: ${{ needs.android-build.outputs.artifact_id }}
          ANDROID_ARTIFACT_SHA: ${{ needs.android-build.outputs.artifact_sha }}
          IOS_ARTIFACT_ID: ${{ needs.ios-build.outputs.artifact_id }}
          IOS_ARTIFACT_SHA: ${{ needs.ios-build.outputs.artifact_sha }}
        run: >-
          python -B tools/stage_mp4_preview.py stage --source "$SOURCE_SHA"
          --work "$RUNNER_TEMP/mp4-draft-staging"
      - name: Retain release ID, final API draft URL and complete readback SHA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp4-draft-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mp4-draft-staging/draft-staging-proof.json
          if-no-files-found: ignore
          retention-days: 14
