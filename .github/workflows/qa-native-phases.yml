name: Verify ARM64 phase interceptor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build the synthetic ARM64 instruction fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/native-phase-qa data/native-phase-input
          sudo rm -rf /usr/share/dotnet /opt/ghc
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
          curl --fail --location --retry 2 --max-time 120 \
            https://repo.maven.apache.org/maven2/com/bytedance/android/shadowhook/2.0.1/shadowhook-2.0.1.aar \
            --output data/native-phase-input/shadowhook-2.0.1.aar
          python android-diagnostics/native/selftest/build_apk.py \
            --output data/native-phase-input/SelfTest.apk \
            --shadowhook-aar data/native-phase-input/shadowhook-2.0.1.aar \
            --ndk "$ANDROID_HOME/ndk/26.3.11579264" \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --javac "$JAVA_HOME/bin/javac" \
            > data/native-phase-qa/build.json
      - name: Exercise original instructions and CPU-state preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          disk-size: 4G
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 1200
          script: >-
            python android-diagnostics/native/selftest/run_emulator.py
            --apk data/native-phase-input/SelfTest.apk
            --serial emulator-5554 --artifacts data/native-phase-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-phase-interceptor-${{ github.run_id }}
          path: data/native-phase-qa
          if-no-files-found: warn
          retention-days: 7
