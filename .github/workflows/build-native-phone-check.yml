name: Build small native phone checker

on:
  workflow_dispatch:
    inputs:
      publish_fixture:
        description: Add the three new checker assets to the existing published diagnostics release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-phone-check-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_TAG: local-diagnostics-v0.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check the published release and exact common guard provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/phone-check-input data/phone-check-dist data/phone-check-evidence
          gh api "repos/$GH_REPO/releases/tags/$TARGET_TAG" > data/phone-check-evidence/release-before.json
          IDOLY_REPORT_ID="$(jq -r '.assets[] | select(.name == "IdolyPride-Local-Diagnostic-Android-arm64.apk.evidence.json") | .id' data/phone-check-evidence/release-before.json)"
          test -n "$IDOLY_REPORT_ID"
          gh api "repos/$GH_REPO/releases/assets/$IDOLY_REPORT_ID" --header 'Accept: application/octet-stream' \
            > data/phone-check-input/published-game-evidence.json
          python - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('checker', 'tools/native_phone_check/build.py')
          checker = importlib.util.module_from_spec(spec); spec.loader.exec_module(checker)
          release = json.loads(Path('data/phone-check-evidence/release-before.json').read_text())
          assert release['tag_name'] == 'local-diagnostics-v0.2.0' and release['draft'] is False
          required = {'IdolyPride-Local-Diagnostic-Android-arm64.apk',
                      'IdolyPride-Local-Diagnostic-Android-arm64.apk.evidence.json', 'SHA256SUMS'}
          assets = {asset['name']: asset for asset in release['assets']}
          assert required <= assets.keys()
          path = Path('data/phone-check-input/published-game-evidence.json')
          assert assets['IdolyPride-Local-Diagnostic-Android-arm64.apk.evidence.json']['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          report = json.loads(path.read_text())
          published = report['diagnostics']['native_phase_probe']['source_sha256']
          assert all(published.get(name) == digest for name, digest in checker.COMMON_HASHES.items())
          assert report['diagnostics']['native_phase_probe']['per_device_preflight_required'] is True
          print('Published diagnostic common guard matches the immutable c814 source hashes')
          PY
      - name: Build and verify the small checker with the stable public key
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264'
          curl --fail --location --retry 2 --max-time 120 \
            https://repo.maven.apache.org/maven2/com/bytedance/android/shadowhook/2.0.1/shadowhook-2.0.1.aar \
            --output data/phone-check-input/shadowhook-2.0.1.aar
          python tools/native_phone_check/build.py \
            --output data/phone-check-dist/IdolyPride-Native-SelfTest-Android-arm64.apk \
            --shadowhook-aar data/phone-check-input/shadowhook-2.0.1.aar \
            --ndk "$ANDROID_HOME/ndk/26.3.11579264" \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --javac "$JAVA_HOME/bin/javac" | tee data/phone-check-evidence/build.json
          (cd data/phone-check-dist && sha256sum --check --strict NativeSelfTest-SHA256SUMS)
      - name: Add only the three new assets without replacing existing files
        if: ${{ inputs.publish_fixture }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$TARGET_TAG" > data/phone-check-evidence/release-at-upload.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('data/phone-check-evidence/release-before.json').read_text())
          current = json.loads(Path('data/phone-check-evidence/release-at-upload.json').read_text())
          assert current['id'] == before['id'] and current['draft'] is False
          assert current['tag_name'] == 'local-diagnostics-v0.2.0'
          assets = {asset['name']: asset for asset in current['assets']}
          for previous in before['assets']:
              assert all(assets[previous['name']][key] == previous[key] for key in ('id', 'size', 'digest'))
          assert not any(path.name in assets for path in Path('data/phone-check-dist').iterdir())
          PY
          gh release upload "$TARGET_TAG" --repo "$GH_REPO" \
            data/phone-check-dist/IdolyPride-Native-SelfTest-Android-arm64.apk \
            data/phone-check-dist/IdolyPride-Native-SelfTest-Android-arm64.apk.evidence.json \
            data/phone-check-dist/NativeSelfTest-SHA256SUMS
          gh api "repos/$GH_REPO/releases/tags/$TARGET_TAG" > data/phone-check-evidence/release-after.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          before = json.loads(Path('data/phone-check-evidence/release-before.json').read_text())
          after = json.loads(Path('data/phone-check-evidence/release-after.json').read_text())
          assert after['id'] == before['id'] and after['draft'] is False
          assert after['tag_name'] == 'local-diagnostics-v0.2.0'
          assets = {asset['name']: asset for asset in after['assets']}
          for previous in before['assets']:
              assert all(assets[previous['name']][key] == previous[key] for key in ('id', 'size', 'digest'))
          for path in Path('data/phone-check-dist').iterdir():
              assert assets[path.name]['size'] == path.stat().st_size
              assert assets[path.name]['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          print('Three new phone-checker assets verified; all pre-existing release assets preserved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-phone-check-${{ github.run_id }}
          path: |
            data/phone-check-dist
            data/phone-check-evidence
          if-no-files-found: warn
          retention-days: 14
