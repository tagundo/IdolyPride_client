name: Debug actual Android game boot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-game-android
  cancel-in-progress: false

jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare disposable runner disk and KVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/android-game-debug data/ci-input data/dist
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr imagemagick
          # Hosted runner only: retain the SDK and remove unused large toolchains.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          df -h . | tee data/android-game-debug/disk.txt
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm | tee data/android-game-debug/kvm.txt
          python -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          echo "IDOLY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          uv sync --locked --all-extras --python 3.12
      - name: Download and verify the pinned game and public server-data source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/assets/726978000" \
            --header 'Accept: application/octet-stream' > data/ci-input/Game-local-r2.apk
          gh api "repos/$GH_REPO/releases/assets/726977995" \
            --header 'Accept: application/octet-stream' > data/ci-input/ServerData-source.zip
          printf '%s  %s\n' \
            '28ecc6a617867d0842a5e88eac3d5736199809a49d4d433ce47816d6a40ba77b' 'data/ci-input/Game-local-r2.apk' \
            '2df8ca651fbb3104b10910dc60a2a87f8cac1db3b5defff56eb4703c769be6b3' 'data/ci-input/ServerData-source.zip' \
            | sha256sum --check --strict | tee data/android-game-debug/input-checksums.txt
          uv run --locked python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          with ZipFile('data/ci-input/ServerData-source.zip') as archive:
              assert archive.testzip() is None
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] == 'data'
              archive.extractall(Path.cwd())
          PY
      - name: Prepare current public fixtures and master tables
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python tools/archive_public_text.py \
            --descriptor-set data/protocol/idolypride-6.1.1.pb --output data/public-fixtures
          uv run --locked --all-extras python tools/build_server_payload.py \
            --output data/dist/ServerData-game-debug.zip | tee data/android-game-debug/payload-build.json
          uv run --locked python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('data/dist/ServerData-game-debug.zip') as archive:
              assert archive.testzip() is None
              for table in ('HierarchyDetailGrade', 'HierarchyGrade'):
                  assert 'data/master-json/' + table + '.json' in archive.namelist(), table
          PY
          uv run --locked --all-extras pytest -q tests android-server/ci qa-native-aes \
            | tee data/android-game-debug/tests.txt
      - name: Build the clearly marked emulator-only AES and no-store variant
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --all-extras python tools/package_qa_aes_client.py \
            data/ci-input/Game-local-r2.apk \
            --output data/dist/Game-QA-software-AES.apk \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --emulator-no-store \
            --report data/android-game-debug/qa-aes-report.json \
            | tee data/android-game-debug/qa-aes-build.txt
      - name: Build the current x86_64 server app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android-server/gradlew
          ./android-server/gradlew -p android-server :app:assembleDebug \
            --no-daemon --console=plain --stacktrace \
            -PbuildPython="$IDOLY_BUILD_PYTHON" -PserverAbi=x86_64 \
            -PserverData="$GITHUB_WORKSPACE/data/dist/ServerData-game-debug.zip" \
            | tee data/android-game-debug/server-build.txt
          cp android-server/app/build/outputs/apk/debug/app-debug.apk data/dist/Server-game-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging data/ci-input/Game-local-r2.apk \
            > data/android-game-debug/game-package.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs data/dist/Server-game-debug.apk \
            > data/android-game-debug/server-signature.txt
      - name: Capture the software-AES QA game on a translated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          disk-size: 4G
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 1200
          script: >-
            uv run --locked python android-server/ci/qa_game_boot.py
            --server-apk data/dist/Server-game-debug.apk
            --game-apk data/dist/Game-QA-software-AES.apk
            --descriptor-set data/protocol/idolypride-6.1.1.pb
            --artifacts data/android-game-debug --duration 180 --interval 10 --startup-timeout 600
            --force-gles30
            --tap-observed-title
            --max-title-taps 2
            --prepare-restarted-tutorial
      - name: Preserve game screenshots and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-android-game-boot-${{ github.run_id }}
          path: data/android-game-debug
          if-no-files-found: warn
          retention-days: 7
