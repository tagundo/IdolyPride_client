name: Debug actual Android game boot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-game-android
  cancel-in-progress: false

jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare disposable runner disk and KVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/android-game-debug data/ci-input data/dist
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr imagemagick
          # Hosted runner only: retain the SDK and remove unused large toolchains.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          df -h . | tee data/android-game-debug/disk.txt
          {
            echo "Host CPUs: $(nproc)"
            free -h
          } | tee data/android-game-debug/host-resources.txt
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm | tee data/android-game-debug/kvm.txt
          python -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          echo "IDOLY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          uv sync --locked --all-extras --python 3.12
      - name: Download the published diagnostic game and complete public payload
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/assets/728205797" \
            --header 'Accept: application/octet-stream' > data/ci-input/Game-local-diagnostics.apk
          gh api "repos/$GH_REPO/releases/assets/729811409" \
            --header 'Accept: application/octet-stream' > data/ci-input/ServerData-published-v0.2.12.zip
          printf '%s  %s\n' \
            'f5be0c0e19c2a17ea28ffa0c3205a49f5ab004f013e2e67e319aa192ca1995df' 'data/ci-input/Game-local-diagnostics.apk' \
            'c3f833d9dca637fa7c7c82dce0d08378bf288beb3cde050e259b6ec8aea39110' 'data/ci-input/ServerData-published-v0.2.12.zip' \
            | sha256sum --check --strict | tee data/android-game-debug/input-checksums.txt
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import stat
          from zipfile import ZipFile

          payload = Path('data/ci-input/ServerData-published-v0.2.12.zip')
          with ZipFile(payload) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Published payload failed ZIP CRC validation')
              names = set()
              public_roots = {'protocol', 'original-master', 'master-json', 'public-fixtures', 'public-tutorial'}
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if (path.is_absolute() or '..' in path.parts or '\\' in item.filename
                          or not path.parts or path.parts[0] != 'data'
                          or str(path) != item.filename.rstrip('/')
                          or stat.S_ISLNK(item.external_attr >> 16)
                          or item.filename in names):
                      raise SystemExit('Published payload contains an unsafe or duplicate ZIP path')
                  if not item.is_dir() and (len(path.parts) < 3 or path.parts[1] not in public_roots):
                      if item.filename != 'data/payload-manifest.json':
                          raise SystemExit('Published payload contains a non-public file')
                  names.add(item.filename)
              manifest = json.loads(archive.read('data/payload-manifest.json'))
              records = manifest['files']
              expected = {row['path'] for row in records} | {'data/payload-manifest.json'}
              actual = {item.filename for item in archive.infolist() if not item.is_dir()}
              if len({row['path'] for row in records}) != len(records) or expected != actual:
                  raise SystemExit('Published payload manifest does not describe its exact file set')
              for row in records:
                  content = archive.read(row['path'])
                  if len(content) != row['bytes'] or hashlib.sha256(content).hexdigest() != row['sha256']:
                      raise SystemExit('Published payload file failed its manifest size/SHA-256 check')
              required = {
                  'data/protocol/idolypride-6.1.1.pb', 'data/original-master/master-tag.json',
                  'data/public-fixtures/manifest.json', 'data/public-tutorial/manifest.json',
                  'data/public-tutorial/tutorial-short.pb', 'data/public-tutorial/tutorial-full.pb',
                  *('data/master-json/' + name + '.json' for name in
                    ('HierarchyDetailGrade', 'HierarchyGrade', 'Setting', 'Tutorial', 'Card',
                     'ManagerLevel', 'CardLevel', 'Consumption', 'Message', 'MessageGroup')),
              }
              if not required.issubset(actual):
                  raise SystemExit('Published payload is missing the current public fixtures or continuation tables')
              archive.extractall(Path.cwd())
          print('Verified and extracted the complete published payload; original ZIP bytes are retained for the APK')
          PY
      - name: Check the current source against the extracted complete public data
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --all-extras pytest -q tests android-server/ci qa-native-aes \
            qa-game-ui/tests qa-game-ui/native/tests \
            | tee data/android-game-debug/tests.txt
      - name: Build the clearly marked emulator-only AES and no-store variant
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --all-extras python tools/package_qa_aes_client.py \
            data/ci-input/Game-local-diagnostics.apk \
            --output data/dist/Game-QA-software-AES.apk \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --expected-source-sha256 f5be0c0e19c2a17ea28ffa0c3205a49f5ab004f013e2e67e319aa192ca1995df \
            --emulator-no-store \
            --report data/android-game-debug/qa-aes-report.json \
            | tee data/android-game-debug/qa-aes-build.txt
      - name: Build the ARM64 QA UI bridge and verify the manifest editor
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'ndk;26.3.11579264'
          uv run --locked python qa-game-ui/native/build_native.py \
            --output data/android-game-debug/qa-ui-native \
            --ndk "$ANDROID_HOME/ndk/26.3.11579264" \
            | tee data/android-game-debug/qa-ui-native-build.json
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar \
            --output data/ci-input/APKEditor-1.4.1.jar
          printf '%s  %s\n' \
            '4a98ae6a755264357603f1906b92e62e757d59229014e33395f4e03ff019fda8' \
            'data/ci-input/APKEditor-1.4.1.jar' \
            | sha256sum --check --strict | tee data/android-game-debug/qa-ui-apkeditor-sha256.txt
      - name: Package the separate ephemeral UI QA game
        shell: bash
        run: |
          set -euo pipefail
          IDOLY_QA_UI_INPUT_SHA="$(uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path('data/dist/Game-QA-software-AES.apk')
          report = json.loads(Path('data/android-game-debug/qa-aes-report.json').read_text())
          with source.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if report['output_apk_sha256'] != digest or report['output_bytes'] != source.stat().st_size:
              raise SystemExit('QA AES intermediate differs from its execution report')
          print(digest)
          PY
          )"
          uv run --locked --all-extras python tools/package_qa_ui_client.py \
            data/dist/Game-QA-software-AES.apk \
            --qa-aes-report data/android-game-debug/qa-aes-report.json \
            --expected-source-sha256 "$IDOLY_QA_UI_INPUT_SHA" \
            --native-library data/android-game-debug/qa-ui-native/lib/arm64-v8a/libidoly_qa_ui_bridge.so \
            --emulator-only \
            --apkeditor data/ci-input/APKEditor-1.4.1.jar \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" \
            --java "$JAVA_HOME/bin/java" \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --output data/dist/Game-QA-UI.apk \
            --report data/android-game-debug/qa-ui-report.json \
            | tee data/android-game-debug/qa-ui-packaging.txt
      - name: Build the current x86_64 server app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android-server/gradlew
          ./android-server/gradlew -p android-server :app:assembleDebug \
            --no-daemon --console=plain --stacktrace \
            -PbuildPython="$IDOLY_BUILD_PYTHON" -PserverAbi=x86_64 \
            -PserverData="$GITHUB_WORKSPACE/data/ci-input/ServerData-published-v0.2.12.zip" \
            | tee data/android-game-debug/server-build.txt
          cp android-server/app/build/outputs/apk/debug/app-debug.apk data/dist/Server-game-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging data/dist/Game-QA-UI.apk \
            > data/android-game-debug/game-package.txt
          grep -F "package: name='game.qualiarts.idolypride.local.diagnostics'" data/android-game-debug/game-package.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs data/dist/Game-QA-UI.apk \
            > data/android-game-debug/qa-ui-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs data/dist/Server-game-debug.apk \
            > data/android-game-debug/server-signature.txt
      - name: Explore the real game using native UI observations and adb input
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 6144M
          disk-size: 8G
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 1200
          script: >-
            uv run --locked python android-server/ci/qa_game_boot.py
            --server-apk data/dist/Server-game-debug.apk
            --game-apk data/dist/Game-QA-UI.apk
            --game-package game.qualiarts.idolypride.local.diagnostics
            --descriptor-set data/protocol/idolypride-6.1.1.pb
            --artifacts data/android-game-debug --duration 600 --interval 20 --startup-timeout 600
            --force-gles30
            --tap-observed-title
            --tree-title-input
            --qa-ui-explore
            --max-title-taps 5
            --prepare-completed-opening
      - name: Preserve game screenshots and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-android-game-boot-${{ github.run_id }}
          path: data/android-game-debug
          if-no-files-found: warn
          retention-days: 7
