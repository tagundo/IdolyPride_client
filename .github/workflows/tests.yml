name: Server checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned Java harness Android tools
        run: sdkmanager 'build-tools;34.0.0' 'platforms;android-34'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked --all-extras --python 3.12
      - name: Prepare pinned protocol for recovered-client tests
        env:
          GH_TOKEN: ${{ github.token }}
          PROTOCOL_PAYLOAD: ${{ runner.temp }}/idoly-public-protocol-payload.zip
        run: |
          gh api repos/tagundo/IdolyPride_client/releases/assets/732944285 \
            --header 'Accept: application/octet-stream' > "$PROTOCOL_PAYLOAD"
          uv run --locked python macos-preserver/extract_descriptor.py \
            --payload "$PROTOCOL_PAYLOAD" --output data/protocol/idolypride-6.1.1.pb
          rm "$PROTOCOL_PAYLOAD"
      - run: uv run --locked --all-extras python -m pytest -q
      - run: uv run --locked python -m compileall -q src tools
