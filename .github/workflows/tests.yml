name: Server checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv run --locked --all-extras python -m pytest -q
      - run: uv run --locked python -m compileall -q src tools
