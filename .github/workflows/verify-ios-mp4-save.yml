name: Verify iOS retained MP4 Save logic (Apple SDK only)

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-unified-server]
    paths:
      - .github/workflows/verify-ios-mp4-save.yml
      - tools/verify_ios_mp4_saved_outputs.py
      - tools/stage_mp4_preview.py
      - tests/test_mp4_preview_delivery.py
      - tests/test_ios_mp4_saved_outputs_ci.py
      - tests/test_ios_mp4_completed_library.py
      - tests/test_ios_mp4_save_lifecycle.py
      - tests/test_ios_mp4_queue_host.py
      - tests/test_ios_mp4_completed_ui.py
      - tests/test_ios_unified_web.py
      - ios-unified/native/IdolyMP4Library.*
      - ios-unified/native/MP4CompletedFilePolicy.h
      - ios-unified/native/IdolyMP4UI.*
      - ios-unified/native/IdolyEmbeddedServer.*
      - ios-unified/native/IdolySettings.m
      - ios-unified/native/IdolyNativeUI.h
      - ios-unified/native/IdolyMacMenu.h
      - ios-unified/native/CornerPolicy.h
      - ios-unified/native/build_native.py
      - ios-unified/native/MP4LifecyclePolicy.h
      - ios-unified/native/MP4FinalizationPolicy.h
      - ios-unified/native/test_mp4_ui_compile.py
      - ios-unified/web/app.js
      - ios-unified/web/index.html

permissions:
  contents: read

concurrency:
  group: ios-mp4-save-${{ github.sha }}
  cancel-in-progress: false

jobs:
  actual-apple-save-logic:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the focused test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify strict no-skip policy and compiled-source receipt closure
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests/test_ios_mp4_saved_outputs_ci.py tests/test_mp4_preview_delivery.py
      - name: Require real Foundation executions, no skips, and both Apple UIKit targets
        run: >-
          python -B tools/verify_ios_mp4_saved_outputs.py
          --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --output-directory "$RUNNER_TEMP/idoly-ios-mp4-save-proof"
      - name: Retain bounded source receipts and synthetic-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-mp4-save-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/idoly-ios-mp4-save-proof
          if-no-files-found: error
          retention-days: 14
