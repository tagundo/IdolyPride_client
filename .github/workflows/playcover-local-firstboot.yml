name: Observe Idoly Pride IPA first boot in PlayCover on qualified Mac

on:
  workflow_dispatch:
    inputs:
      playcover_version:
        description: Pinned PlayCover release; 3.1.0 build 1633 matches the working user setup
        type: choice
        required: true
        default: '3.1.0'
        options:
          - '3.1.0'
          - '4.0.0-prerelease'
      ipa_variant:
        description: Pinned unmodified QualiArts IPA or local connection client
        type: choice
        required: true
        default: local
        options:
          - local
          - original
      compare_canonical_launch:
        description: Compare canonical LaunchServices opening after the observed PlayCover UIKit check-in failure
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: playcover-firstboot-${{ inputs.playcover_version || '3.1.0' }}-${{ inputs.ipa_variant || 'local' }}
  cancel-in-progress: false

jobs:
  firstboot:
    runs-on: macos-15
    timeout-minutes: 15
    # GitHub requires write access to read an unpublished release asset.
    # This job only downloads the pinned draft backend; it never publishes.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IDOLY_IPA_VARIANT: ${{ inputs.ipa_variant || 'local' }}
      IDOLY_PLAYCOVER_VERSION: ${{ inputs.playcover_version || '3.1.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Compile native host and accessibility probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/playcover-firstboot
          swiftc tools/probe_playcover_host.swift -o "$RUNNER_TEMP/playcover-host-probe" \
            2> data/playcover-firstboot/host-compile.txt
          swiftc tools/playcover_firstboot/ax_driver.swift -o "$RUNNER_TEMP/playcover-ax-driver" \
            2> data/playcover-firstboot/ax-compile.txt
      - name: Recheck this ephemeral Mac before installing any app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          output = Path('data/playcover-firstboot/host.json')
          result = subprocess.run([str(Path(os.environ['RUNNER_TEMP']) / 'playcover-host-probe')],
              text=True, capture_output=True, timeout=45, check=True)
          assert len(result.stdout.encode()) <= 65536
          report = json.loads(result.stdout)
          output.write_text(json.dumps(report, indent=2) + '\n')
          assert report.get('candidate_eligible') is True, 'Ephemeral Mac failed the host capability checks'
          PY
      - name: Download and verify the exact PlayCover, selected IPA and backend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          folder = Path('data/playcover-firstboot/input'); folder.mkdir()
          assets = [
              ('tagundo/IdolyPride_client', 731458081, 'IdolyPride-Server-macOS.app.zip', 94633315,
               'f1cbabf133015587ed2cd72e9f2d80fdf8eded7f92d70a4314d277e72030cb99')]
          playcovers = {
              '3.1.0': (189832208, 5563083, '5c3a291827f4802f665daf5c33a6bfe6ef0df2c6dff3f9e554db6514176196e7'),
              '4.0.0-prerelease': (617729765, 7031217, '54e01381205ed7de05f8316ca229eab39ab8f6202b0dda4de07e98396e64d79e')}
          identity, size, digest = playcovers[os.environ['IDOLY_PLAYCOVER_VERSION']]
          assets.insert(0, ('PlayCover/PlayCover', identity, 'PlayCover.dmg', size, digest))
          clients = {
              'local': (726978003, 146399786, 'f02993302c186ac353d2b96f5aefbe93d3794d5309e142184be08547f9f8cfb3'),
              'original': (725761399, 146438450, '33197938a0990b267af2d67c09e9d1123694e28695fc39d9650ca4f6aa661848')}
          identity, size, digest = clients[os.environ['IDOLY_IPA_VARIANT']]
          assets.append(('tagundo/IdolyPride_client', identity, 'IdolyPride-Under-Test.ipa', size, digest))
          evidence = []
          for repo, identity, name, size, digest in assets:
              destination = folder / name
              with destination.open('wb') as stream:
                  subprocess.run(['gh', 'api', f'repos/{repo}/releases/assets/{identity}',
                      '--header', 'Accept: application/octet-stream'], stdout=stream,
                      stderr=subprocess.PIPE, timeout=120, check=True)
              with destination.open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert destination.stat().st_size == size and actual == digest, name + ' digest/size mismatch'
              evidence.append({'repository': repo, 'asset_id': identity, 'file': name,
                               'bytes': size, 'sha256': digest})
          Path('data/playcover-firstboot/inputs.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Install through PlayCover and observe the selected game client
        env:
          IDOLY_COMPARE_CANONICAL_LAUNCH: ${{ inputs.compare_canonical_launch }}
        shell: bash
        run: |
          set -euo pipefail
          set --
          if [[ "$IDOLY_COMPARE_CANONICAL_LAUNCH" == 'true' ]]; then
            set -- --compare-canonical-launch
          fi
          python3 tools/playcover_firstboot/firstboot.py \
            --input data/playcover-firstboot/input --output data/playcover-firstboot/evidence \
            --ax-driver "$RUNNER_TEMP/playcover-ax-driver" --timeout 480 \
            --ipa-variant "$IDOLY_IPA_VARIANT" --playcover-version "$IDOLY_PLAYCOVER_VERSION" "$@"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playcover-local-firstboot-${{ github.run_id }}
          path: |
            data/playcover-firstboot/host.json
            data/playcover-firstboot/inputs.json
            data/playcover-firstboot/*compile.txt
            data/playcover-firstboot/evidence
          if-no-files-found: error
          retention-days: 14
